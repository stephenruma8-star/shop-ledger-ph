body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#f1f5f9;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{background-image:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(59,130,246,.14),transparent),radial-gradient(ellipse 60% 40% at 90% 110%,rgba(29,78,216,.10),transparent)}
::-webkit-scrollbar{width:0;height:0}
.fade-in{animation:fadeIn .2s ease-out}@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.slide-up{animation:slideUp .28s cubic-bezier(.32,.72,.28,1)}@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.scale-in{animation:scaleIn .18s ease-out}@keyframes scaleIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.shimmer{background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);background-size:200% 100%;animation:shimmer 2s infinite}@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.pulse-soft{animation:pulseSoft 2s ease-in-out infinite}@keyframes pulseSoft{0%,100%{opacity:1}50%{opacity:.6}}
.card-hover{transition:transform .15s ease,box-shadow .15s ease}.card-hover:active{transform:scale(.99)}
.badge-pop{animation:badgePop .3s ease-out}@keyframes badgePop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.row-out{animation:rowOut .22s ease-out forwards;overflow:hidden}@keyframes rowOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
.num{font-variant-numeric:tabular-nums}
.icon{flex:none}
.glass{background:rgba(30,41,59,.85);border:1px solid rgba(255,255,255,.07)}
.glass-card{background:rgba(30,41,59,.8);border:1px solid rgba(255,255,255,.07)}
.glass-input{background:rgba(30,41,59,.55);border:1px solid rgba(255,255,255,.09)}

.stat-card{background:rgba(30,41,59,.8);border:1px solid rgba(255,255,255,.07)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.6rem;padding:.25rem .9rem;border-radius:.75rem;font-weight:600;font-size:.875rem;border:1px solid transparent;transition:filter .15s ease,transform .1s ease;flex:none;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn-sm{min-height:2.1rem;padding:.15rem .7rem;font-size:.8rem;border-radius:.65rem}
.btn-lg{min-height:3.25rem;font-size:1rem;border-radius:.9rem}
.btn-primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.35)}
.btn-success{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;box-shadow:0 6px 16px rgba(22,163,74,.3)}
.btn-ghost{background:rgba(255,255,255,.07);color:#cbd5e1;border-color:rgba(255,255,255,.08)}

.inp{display:block;width:100%;height:2.85rem;padding:0 .85rem;border-radius:.75rem;background:rgba(30,41,59,.55);border:1px solid rgba(255,255,255,.09);color:#f1f5f9;font-size:.9375rem;outline:none}
.inp:focus{border-color:rgba(96,165,250,.55);box-shadow:0 0 0 3px rgba(59,130,246,.14)}
select.inp{appearance:none;-webkit-appearance:none;padding-right:2.2rem;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%2394a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');background-repeat:no-repeat;background-position:right .8rem center;background-size:.95rem}
select.inp option{background:#0f172a;color:#f1f5f9}
.switch{appearance:none;-webkit-appearance:none;width:2.75rem;height:1.55rem;border-radius:9999px;background:rgba(255,255,255,.14);position:relative;transition:background .2s ease;cursor:pointer;flex:none}
.switch::before{content:'';position:absolute;top:.15rem;left:.15rem;width:1.25rem;height:1.25rem;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .2s ease}
.switch:checked{background:#2563eb}
.switch:checked::before{transform:translateX(1.2rem)}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .65rem;border-radius:9999px;font-size:.75rem;font-weight:600;flex:none;white-space:nowrap}
.chip-green{background:rgba(22,163,74,.15);color:#4ade80;border:1px solid rgba(34,197,94,.25)}
.chip-amber{background:rgba(245,158,11,.14);color:#fbbf24;border:1px solid rgba(245,158,11,.3)}
.chip-red{background:rgba(239,68,68,.14);color:#f87171;border:1px solid rgba(239,68,68,.3)}
.chip-blue{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}
header{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top, 0px);background:rgba(15,23,42,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.07)}
#tabnav{display:none}
@media(min-width:768px){#tabnav{display:flex}}
.nav-btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;flex:1;min-width:64px;min-height:2.6rem;padding:0 .6rem;border-radius:.65rem;font-size:.83rem;font-weight:600;color:#94a3b8;transition:background .15s ease,color .15s ease;cursor:pointer;border:none}
.nav-btn.active{background:rgba(59,130,246,.18);color:#60a5fa}
.icon-nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;background:rgba(15,23,42,.96);border-top:1px solid rgba(255,255,255,.07);padding-bottom:env(safe-area-inset-bottom)}
.nav-item{position:relative;flex:1;min-height:3.9rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 .25rem;color:#94a3b8;font-size:10.5px;font-weight:600;letter-spacing:.01em;background:transparent;border:none;transition:color .15s ease,background .15s ease;cursor:pointer}
.nav-item svg{width:21px;height:21px}
.nav-item .lbl{line-height:1;margin-top:1px}
.nav-item.active{color:#93c5fd}
.nav-item.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:20px;height:3px;border-radius:0 0 9999px 9999px;background:#3b82f6;box-shadow:0 2px 8px rgba(59,130,246,.6)}
.nav-item.nav-sale{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff}

.nav-item .nav-badge{position:absolute;top:5px;left:calc(50% + 2px);min-width:17px;height:17px;padding:0 4px;border-radius:9999px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.5)}
#nav-modal{display:none;position:fixed;inset:0;z-index:35;align-items:flex-end;justify-content:center}
#nav-backdrop{position:absolute;inset:0;background:rgba(2,6,23,.7);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#sheet{position:relative;width:100%;max-width:31rem;max-height:calc(100vh - 4.9rem - env(safe-area-inset-bottom));max-height:calc(100dvh - 4.9rem - env(safe-area-inset-bottom));display:flex;flex-direction:column;background:rgba(15,23,42,.97);border:1px solid rgba(255,255,255,.09);border-bottom:none;border-radius:1.25rem 1.25rem 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.55);overflow:hidden}
@media(min-width:640px){#nav-modal{align-items:center;padding-bottom:5rem}#sheet{max-height:min(88dvh,46rem);max-height:min(88vh,46rem);border-radius:1.25rem;border-bottom:1px solid rgba(255,255,255,.09)}}

.grabber{width:40px;height:4.5px;border-radius:9999px;background:rgba(255,255,255,.16);margin:0 auto}
.row{display:flex;align-items:center;gap:.75rem}
.row+.row{border-top:1px solid rgba(255,255,255,.05)}
.card-title{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:.9rem;color:#e2e8f0}
.icon-tile{width:2.1rem;height:2.1rem;border-radius:.65rem;display:flex;align-items:center;justify-content:center;flex:none}
.picked{outline:2px solid rgba(239,68,68,.55)!important;border-radius:.75rem;background:rgba(239,68,68,.07)!important}

body.big-text .btn-sm{font-size:.85rem}
</style>
