body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#f1f5f9;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{background-image:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(59,130,246,.14),transparent),radial-gradient(ellipse 60% 40% at 90% 110%,rgba(29,78,216,.10),transparent)}
::-webkit-scrollbar{width:0;height:0}
.fade-in{animation:fadeIn .2s ease-out}@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.slide-up{animation:slideUp .28s cubic-bezier(.32,.72,.28,1)}@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.scale-in{animation:scaleIn .18s ease-out}@keyframes scaleIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.shimmer{background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);background-size:200% 100%;animation:shimmer 2s infinite}@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.pulse-soft{animation:pulseSoft 2s ease-in-out infinite}@keyframes pulseSoft{0%,100%{opacity:1}50%{opacity:.6}}
.card-hover{transition:transform .15s ease,box-shadow .15s ease}.card-hover:active{transform:scale(.99)}
.badge-pop{animation:badgePop .3s ease-out}@keyframes badgePop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.row-out{animation:rowOut .22s ease-out forwards;overflow:hidden}@keyframes rowOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
.num{font-variant-numeric:tabular-nums}
.icon{flex:none}
.glass{background:rgba(30,41,59,.85);border:1px solid rgba(255,255,255,.07)}
.glass-card{background:rgba(30,41,59,.8);border:1px solid rgba(255,255,255,.07)}
.glass-input{background:rgba(30,41,59,.55);border:1px solid rgba(255,255,255,.09)}

.stat-card{background:rgba(30,41,59,.8);border:1px solid rgba(255,255,255,.07)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.6rem;padding:.25rem .9rem;border-radius:.75rem;font-weight:600;font-size:.875rem;border:1px solid transparent;transition:filter .15s ease,transform .1s ease;flex:none;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn-sm{min-height:2.1rem;padding:.15rem .7rem;font-size:.8rem;border-radius:.65rem}
.btn-lg{min-height:3.25rem;font-size:1rem;border-radius:.9rem}
.btn-primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.35)}
.btn-success{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;box-shadow:0 6px 16px rgba(22,163,74,.3)}
.btn-ghost{background:rgba(255,255,255,.07);color:#cbd5e1;border-color:rgba(255,255,255,.08)}

.inp{display:block;width:100%;height:2.85rem;padding:0 .85rem;border-radius:.75rem;background:rgba(30,41,59,.55);border:1px solid rgba(255,255,255,.09);color:#f1f5f9;font-size:.9375rem;outline:none}
.inp:focus{border-color:rgba(96,165,250,.55);box-shadow:0 0 0 3px rgba(59,130,246,.14)}
select.inp{appearance:none;-webkit-appearance:none;padding-right:2.2rem;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%2394a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');background-repeat:no-repeat;background-position:right .8rem center;background-size:.95rem}
select.inp option{background:#0f172a;color:#f1f5f9}
.switch{appearance:none;-webkit-appearance:none;width:2.75rem;height:1.55rem;border-radius:9999px;background:rgba(255,255,255,.14);position:relative;transition:background .2s ease;cursor:pointer;flex:none}
.switch::before{content:'';position:absolute;top:.15rem;left:.15rem;width:1.25rem;height:1.25rem;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .2s ease}
.switch:checked{background:#2563eb}
.switch:checked::before{transform:translateX(1.2rem)}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .65rem;border-radius:9999px;font-size:.75rem;font-weight:600;flex:none;white-space:nowrap}
.chip-green{background:rgba(22,163,74,.15);color:#4ade80;border:1px solid rgba(34,197,94,.25)}
.chip-amber{background:rgba(245,158,11,.14);color:#fbbf24;border:1px solid rgba(245,158,11,.3)}
.chip-red{background:rgba(239,68,68,.14);color:#f87171;border:1px solid rgba(239,68,68,.3)}
.chip-blue{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}
header{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top, 0px);background:rgba(15,23,42,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.07)}
#tabnav{display:none}
@media(min-width:768px){#tabnav{display:flex}}
.nav-btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;flex:1;min-width:64px;min-height:2.6rem;padding:0 .6rem;border-radius:.65rem;font-size:.83rem;font-weight:600;color:#94a3b8;transition:background .15s ease,color .15s ease;cursor:pointer;border:none}
.nav-btn.active{background:rgba(59,130,246,.18);color:#60a5fa}
.icon-nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;background:rgba(15,23,42,.96);border-top:1px solid rgba(255,255,255,.07);padding-bottom:env(safe-area-inset-bottom)}
.nav-item{position:relative;flex:1;min-height:3.9rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 .25rem;color:#94a3b8;font-size:10.5px;font-weight:600;letter-spacing:.01em;background:transparent;border:none;transition:color .15s ease,background .15s ease;cursor:pointer}
.nav-item svg{width:21px;height:21px}
.nav-item .lbl{line-height:1;margin-top:1px}
.nav-item.active{color:#93c5fd}
.nav-item.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:20px;height:3px;border-radius:0 0 9999px 9999px;background:#3b82f6;box-shadow:0 2px 8px rgba(59,130,246,.6)}
.nav-item.nav-sale{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff}

.nav-item .nav-badge{position:absolute;top:5px;left:calc(50% + 2px);min-width:17px;height:17px;padding:0 4px;border-radius:9999px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.5)}
#nav-modal{display:none;position:fixed;inset:0;z-index:35;align-items:flex-end;justify-content:center}
#nav-backdrop{position:absolute;inset:0;background:rgba(2,6,23,.7);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#sheet{position:relative;width:100%;max-width:31rem;max-height:calc(100vh - 4.9rem - env(safe-area-inset-bottom));max-height:calc(100dvh - 4.9rem - env(safe-area-inset-bottom));display:flex;flex-direction:column;background:rgba(15,23,42,.97);border:1px solid rgba(255,255,255,.09);border-bottom:none;border-radius:1.25rem 1.25rem 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.55);overflow:hidden}
@media(min-width:640px){#nav-modal{align-items:center;padding-bottom:5rem}#sheet{max-height:min(88dvh,46rem);max-height:min(88vh,46rem);border-radius:1.25rem;border-bottom:1px solid rgba(255,255,255,.09)}}

.grabber{width:40px;height:4.5px;border-radius:9999px;background:rgba(255,255,255,.16);margin:0 auto}
.row{display:flex;align-items:center;gap:.75rem}
.row+.row{border-top:1px solid rgba(255,255,255,.05)}
.card-title{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:.9rem;color:#e2e8f0}
.icon-tile{width:2.1rem;height:2.1rem;border-radius:.65rem;display:flex;align-items:center;justify-content:center;flex:none}
.picked{outline:2px solid rgba(239,68,68,.55)!important;border-radius:.75rem;background:rgba(239,68,68,.07)!important}

body.big-text .btn-sm{font-size:.85rem}
</style>

<script>

// ===== src/mobile/core.js =====
function isNativeApp() {
  try { return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); } catch (e) { return false; }
}
function nativePlugin(name) {
  try { return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins[name]) || null; } catch (e) { return null; }
}
// In the native app the UI is bundled (capacitor://localhost) while the shop
// lives at the saved LAN address; in the browser it is just the page origin.
const API = (() => {
  try {
    const u = localStorage.getItem('slpServerUrl');
    if (u) return String(u).replace(/\/+$/, '');
  } catch (e) {}
  return window.location.origin;
})();
const peso = (n) => '₱' + (Number(n) || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
}
let data = { stats: null, clients: [], inventory: [], transactions: [], expenses: [], suppliers: [], purchaseOrders: [], reports: null, settings: {}, quickItems: [] };
let cart = [];
let currentView = 'home';
let navModalOpen = false;
let qStepQty = 1;
let poItems = [];

function getClaim() {
  const m = window.location.search.match(/claim=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : '';
}
function getToken() {
  // A stored device token always wins: QR claims are single-use, so a reload
  // must not swap the working token for a burned claim. ?token= only seeds
  // fresh phones (legacy QR links / bookmarks).
  try {
    const stored = localStorage.getItem('slpToken') || '';
    if (stored) return stored;
  } catch (e) {}
  const m = window.location.search.match(/token=([^&]+)/);
  const urlToken = m ? m[1] : '';
  if (urlToken) { try { localStorage.setItem('slpToken', urlToken); } catch (e) {} }
  return urlToken;
}
const HDR = () => ({ 'X-Auth-Token': getToken() });

// Counter role: cashier phones see counter work only (no revenue figures,
// reports, or expenses). Legacy/master sessions default to owner.
function phoneRole() {
  try { return localStorage.getItem('slpRole') || 'owner'; } catch (e) { return 'owner'; }
}
// Thumbnails live outside the list payloads (see /api/inventory/images) and
// are cached here per boot; only unseen ids are ever fetched.
let itemImages = {};
async function loadItemImages() {
  try {
    const missing = (data.inventory || []).map(i => i.id).filter(id => id !== undefined && id !== null && !(id in itemImages));
    if (!missing.length) return;
    for (let k = 0; k < missing.length; k += 100) {
      const chunk = missing.slice(k, k + 100);
      const m = await apiGet('/api/inventory/images?ids=' + chunk.map(id => encodeURIComponent(id)).join(',')).catch(() => null);
      if (m) for (const id of Object.keys(m)) itemImages[id] = m[id] || null;
      chunk.forEach(id => { if (!(id in itemImages)) itemImages[id] = null; });
    }
  } catch (e) {}
}
function itemImage(item) {
  try {
    if (!item) return '';
    if (item.image) return item.image;
    return itemImages[item.id] || '';
  } catch (e) { return ''; }
}
function applyRoleGating() {
  try {
    const hide = phoneRole() === 'cashier';
    document.querySelectorAll('[data-nav="reports"], [data-nav="expenses"], [data-nav="suppliers"], [data-nav="purchase-orders"]').forEach(el => {
      el.style.display = hide ? 'none' : '';
    });
  } catch (e) {}
}
// Single brand slot: the header shows the shop's own name (loaded with
// settings); the app name lives only on the boot splash + document title.
function applyBrand() {
  try {
    const el = document.getElementById('brand-name');
    if (el) el.textContent = (data.settings && data.settings.shopName) || 'Shop Ledger PH';
  } catch (e) {}
}

function toast(msg, type) {
  const root = document.getElementById('toast-root');
  if (!root) return;
  const el = document.createElement('div');  el.className = (type === 'err' ? 'bg-red-600' : type === 'ok' ? 'bg-green-600' : 'bg-blue-600') + ' text-white text-sm px-4 py-3 rounded-xl shadow-xl border border-white/10 slide-in text-center';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => { try { el.remove(); } catch (e) {} }, 300); }, 2600);
}

// ---------- feel: haptics + sound ----------
// Vibration + beep confirm actions without looking (noisy shops, pocket use).
// Everything guarded: desktops and browsers without these APIs just skip.
let audioCtx = null;
function buzz(pattern) {
  try {
    const H = nativePlugin('Haptics');
    if (H && typeof H.vibrate === 'function') {
      H.vibrate({ duration: Array.isArray(pattern) ? pattern[0] : (pattern || 15) }).catch(() => {});
      return;
    }
    if (navigator.vibrate) navigator.vibrate(pattern);
  } catch (e) {}
}
function beep(freq, dur, delay) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = audioCtx || new AC();
    if (audioCtx.state === 'suspended') { try { audioCtx.resume().catch(() => {}); } catch (e) {} }
    const t = audioCtx.currentTime + (delay || 0);
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = freq || 880;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.12));
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + (dur || 0.12) + 0.05);
  } catch (e) {}
}
function feelAdd() { buzz(12); beep(660, 0.08); }
function feelOk() { buzz(15); beep(880, 0.1); }
function feelSale() { buzz([20, 40, 20]); beep(660, 0.1); beep(990, 0.16, 0.12); }
function feelErr() { buzz([45, 45, 45]); beep(220, 0.18); }

const API_TIMEOUT_MS = 15000;
async function fetchTimeout(url, opts) {
  // Stalled shop Wi-Fi must never wedge the UI on a hung request: abort past
  // the timeout. AbortError is treated as a network drop by apiPost (queues).
  if (typeof AbortController === 'undefined') return fetch(url, opts);
  const ctrl = new AbortController();
  const t = setTimeout(() => { try { ctrl.abort(); } catch (e) {} }, API_TIMEOUT_MS);
  try {
    return await fetch(url, { ...(opts || {}), signal: ctrl.signal });
  } finally { try { clearTimeout(t); } catch (e) {} }
}
async function apiGet(path) {
  const r = await fetchTimeout(API + path, { headers: HDR() });
  if (r.status === 401 && getToken()) {
    try { localStorage.removeItem('slpToken'); localStorage.removeItem('slpRole'); } catch (e) {}
    renderPairScreen(T('pair.session_expired'));
    throw new Error('HTTP 401');
  }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
// ---------- diagnostics ----------
// JS errors are queued on-device (cap 50) and uploaded to the shop computer,
// where they land in mobile-diag.json and the desktop logs. Without this a
// crashing phone fails silently and nobody ever finds out.
const DIAG_KEY = 'slpDiag';
const DIAG_MAX = 50;
function diagPush(kind, message) {
  try {
    const list = JSON.parse(localStorage.getItem(DIAG_KEY) || '[]');
    if (!Array.isArray(list)) return;
    list.push({ at: new Date().toISOString(), kind: String(kind || 'error').slice(0, 20), message: String(message || '').slice(0, 500) });
    while (list.length > DIAG_MAX) list.shift();
    localStorage.setItem(DIAG_KEY, JSON.stringify(list));
  } catch (e) {}
}
function diagTake() {
  try {
    const list = JSON.parse(localStorage.getItem(DIAG_KEY) || '[]');
    localStorage.setItem(DIAG_KEY, '[]');
    return Array.isArray(list) ? list : [];
  } catch (e) { return []; }
}
function setupDiagHook() {
  try {
    window.addEventListener('error', (e) => {
      diagPush('js-error', ((e && e.message) || 'error') + ' @ ' + ((e && e.filename) || '') + ':' + ((e && e.lineno) || ''));
    });
    window.addEventListener('unhandledrejection', (e) => {
      const r = e && e.reason;
      diagPush('unhandled-rejection', (r && (r.stack || r.message)) || String(r));
    });
  } catch (e) {}
}
async function uploadDiagnostics(manual) {
  const entries = diagTake();
  if (!entries.length) { if (manual) toast(T('diag.empty'), 'info'); return 0; }
  try {
    let appVersion = '';
    try { appVersion = await bundledAppVersion(); } catch (e) {}
    await apiPost('/api/mobile-diag', { entries: entries.slice(0, 20), appVersion });
    try { localStorage.setItem('slpDiagSent', new Date().toISOString()); } catch (e) {}
    if (manual) toast(T('diag.sent', { n: entries.length }), 'ok');
    updateDiagRow();
    return entries.length;
  } catch (e) {
    try {
      const back = JSON.parse(localStorage.getItem(DIAG_KEY) || '[]');
      localStorage.setItem(DIAG_KEY, JSON.stringify(entries.concat(Array.isArray(back) ? back : []).slice(-DIAG_MAX)));
    } catch (_) {}
    if (manual) toast(T('diag.failed', { msg: e.message }), 'err');
    return 0;
  }
}
async function updateDiagRow() {
  const box = document.getElementById('diag-row');
  if (!box) return;
  let pending = 0, sent = '';
  try {
    const list = JSON.parse(localStorage.getItem(DIAG_KEY) || '[]');
    if (Array.isArray(list)) pending = list.length;
    sent = localStorage.getItem('slpDiagSent') || '';
  } catch (e) {}
  box.innerHTML = `
    <p class="text-[11px] text-gray-500 mb-2">${T('diag.desc')}</p>
    <p class="text-[11px] text-gray-500 mb-2">${pending ? T('diag.pending', { n: pending }) : T('diag.empty_short')}${sent ? ' · ' + T('diag.last', { at: String(sent).slice(0, 10) }) : ''}</p>
    <button onclick="uploadDiagnostics(true)" class="w-full py-2.5 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-500">${T('diag.send')}</button>`;
}
// Statement of account text for sharing (Messenger, SMS, print notes).
function buildStatementText(client, sales, payments) {
  client = client || {};
  const L = [];
  L.push(T('cli.stmt_title'));
  L.push(client.name || '');
  if (client.phone) L.push(client.phone);
  if (client.address) L.push(client.address);
  L.push('--------------------------------');
  (sales || []).forEach(t => {
    L.push(`${t.date || ''}  ${t.invoiceNo || ''}  ${peso(t.grandTotal)} (${t.status || ''})`);
  });
  (payments || []).forEach(p => {
    L.push(`${p.date || ''}  ${T('cli.stmt_pay')}  -${peso(p.amount)}${p.type ? ' (' + p.type + ')' : ''}`);
  });
  L.push('--------------------------------');
  L.push(T('cli.stmt_balance', { amt: peso(client.balance) }));
  return L.join('\n');
}
// ---------- receipt sharing ----------
// Plain-text receipt any messenger accepts. Chain: native Share sheet →
// Web Share API → clipboard, whichever this phone supports.
function buildReceiptText(t, shop) {
  t = t || {}; shop = shop || {};
  const L = [];
  L.push(shop.shopName || 'Shop Ledger PH');
  if (shop.shopAddress) L.push(shop.shopAddress);
  if (shop.shopContact) L.push(shop.shopContact);
  L.push('--------------------------------');
  L.push('Invoice: ' + (t.invoiceNo || 'N/A'));
  L.push('Date: ' + (t.createdAt || t.date || ''));
  if (t.clientName && t.clientName !== 'Walk-in') L.push('Client: ' + t.clientName);
  (t.items || []).forEach(it => {
    const q = parseFloat(it.qty) || 1;
    const p = it.unitCost || it.price || 0;
    L.push(`${it.description || it.name || 'Item'}  ${q} x ${peso(p)} = ${peso(q * p)}`);
  });
  L.push('--------------------------------');
  L.push('TOTAL: ' + peso(t.grandTotal) + ' (' + (t.paymentMethod || 'Cash') + ')');
  L.push(shop.receiptFooter || 'Thank you for your patronage!');
  return L.join('\n');
}
// Submit locks: a double-tapped Save must never post twice (double sales,
// double payments). Keyed per flow; always released in a finally block.
const submitLocks = {};
function takeSubmitLock(key) {
  try {
    if (submitLocks[key]) return false;
    submitLocks[key] = true;
    return true;
  } catch (e) { return true; }
}
function releaseSubmitLock(key) {
  try { submitLocks[key] = false; } catch (e) {}
}
// Share chain used by receipts and reports: native sheet → Web Share API
// → clipboard, whichever this phone supports.
async function shareText(title, text) {
  try {
    const S = nativePlugin('Share');
    if (S && typeof S.share === 'function') {
      await S.share({ title, text, dialogTitle: title });
      return true;
    }
  } catch (e) {}
  try {
    if (navigator.share) { await navigator.share({ title, text }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return true; }
  try {
    await navigator.clipboard.writeText(text);
    toast(T('share.copied'), 'ok');
    return true;
  } catch (e) {}
  toast(T('share.unavailable'), 'err');
  return false;
}
async function shareReceiptTxn(id) {
  let t = null;
  try { t = await apiGet('/api/transactions/' + encodeURIComponent(id)); }
  catch (e) { toast(T('txn.load_fail', { msg: e.message }), 'err'); return; }
  const text = buildReceiptText(t, (data.settings || {}));
  await shareText('Receipt ' + (t.invoiceNo || ''), text);
}

// ===== src/mobile/pair.js =====
// ---------- pairing (connect without QR) ----------
function renderPairScreen(notice) {
  const ls = document.getElementById('loading-screen');
  if (ls) ls.classList.add('hidden');
  const v = document.getElementById('view');
  const claim = getClaim();
  v.innerHTML = `
    <div class="glass-card rounded-2xl p-6 mt-10 text-center fade-in">
      <div class="w-14 h-14 mx-auto rounded-2xl flex items-center justify-center text-white shadow-lg mb-3" style="background:linear-gradient(135deg,#2563eb,#1d4ed8)"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
      <h2 class="text-lg font-bold text-gray-100 mb-1">${T('pair.title')}</h2>
      <p class="text-xs text-gray-400 mb-4">${T('pair.instr')}</p>
      ${notice ? `<p class="text-xs text-amber-400 mb-3">${esc(notice)}</p>` : ''}
      <input id="pair-name" maxlength="24" placeholder="${esc(T('pair.name_ph'))}" class="w-56 mx-auto text-center text-sm px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 text-gray-100 outline-none focus:border-blue-500 mb-2" />
      ${claim
        ? `<p class="text-[11px] text-gray-500 mb-2">${T('pair.claim_note')}</p>`
        : `<input id="pair-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" class="w-44 mx-auto text-center text-2xl font-mono font-bold tracking-[0.3em] px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 text-gray-100 outline-none focus:border-blue-500 mb-2" />`}
      <p id="pair-error" class="hidden text-xs text-red-400 mb-2"></p>
      <button onclick="submitPairCode()" class="w-full py-3 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-500">${T('pair.connect')}</button>
      <p class="text-[11px] text-gray-500 mt-3">${esc(T('pair.foot', { host: window.location.host }))}</p>
    </div>`;
}
async function submitPairCode() {
  const err = document.getElementById('pair-error');
  const fail = (m) => { if (err) { err.textContent = m; err.classList.remove('hidden'); } };
  const nameEl = document.getElementById('pair-name');
  const name = ((nameEl && nameEl.value) || '').trim().slice(0, 24) || 'Phone';
  const claim = getClaim();
  let path, body;
  if (claim) {
    path = '/api/claim';
    body = { claim, name };
  } else {
    const inp = document.getElementById('pair-code');
    const code = ((inp && inp.value) || '').replace(/\D/g, '');
    if (code.length !== 6) { fail(T('pair.code_guide')); return; }
    path = '/api/pair';
    body = { code, name };
  }
  if (!takeSubmitLock('pair')) return;
  try {
    const r = await fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.success || !j.token) throw new Error((j && j.error) || T('pair.rejected'));
    try {
      localStorage.setItem('slpToken', j.token);
      if (j.name) localStorage.setItem('slpDeviceName', j.name);
      if (j.role) localStorage.setItem('slpRole', j.role);
    } catch (e) {}
    // Burned claims must not linger in the URL: the stored token rules from here on.
    try {
      if (claim && window.history && history.replaceState) {
        const clean = window.location.search.replace(/claim=[^&]*&?/, '').replace(/[?&]$/, '');
        history.replaceState(null, '', window.location.pathname + clean + window.location.hash);
      }
    } catch (e) {}
    toast(T('pair.connected') + (j.name ? T('pair.connected_as', { name: j.name }) : ''), 'ok');
    feelOk();
    if (location.reload) location.reload();
  } catch (e) { fail(e.message || T('pair.failed')); }
  finally { releaseSubmitLock('pair'); }
}

// ===== src/mobile/pwa.js =====
// ---------- PWA install ----------
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  updateInstallRow();
});
async function installApp() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  try { await deferredInstallPrompt.userChoice; } catch (e) {}
  deferredInstallPrompt = null;
  updateInstallRow();
}
function updateInstallRow() {
  const b = document.getElementById('install-app-btn');
  const h = document.getElementById('install-hint');
  if (!b) return;
  if (isNativeApp()) {
    b.classList.add('hidden');
    if (h) h.textContent = T('set.install_native');
    return;
  }
  if (deferredInstallPrompt) {
    b.classList.remove('hidden');
    if (h) h.textContent = T('set.install_prompt');
  } else {
    b.classList.add('hidden');
    if (h) h.textContent = T('set.install_hint');
  }
}

// ===== src/mobile/pin.js =====
// ---------- phone lock (PIN) ----------
// Optional device-local PIN: gates this phone behind a short code, auto-locks
// after 5 idle minutes. Honest scope: stops casual access (family, customers,
// finders) — NOT vault-grade, since the token lives in this browser's storage.
// Lost phone? Revoke it on the desktop (Sidebar → Mobile Access).
const PIN_AUTOLOCK_MS = 5 * 60 * 1000;
let pinTimer = null;
let pinWatchOn = false;
function pinHashGet() { try { return localStorage.getItem('slpPinHash') || ''; } catch (e) { return ''; } }

// ---------- pull to refresh ----------
// Drag down from the very top to re-sync. Chrome's native reload is disabled
// via overscroll-behavior (a reload would wipe the in-memory cart).
function setupPullRefresh() {
  let startY = null;
  try {
    window.addEventListener('touchstart', (e) => {
      try {
        if ((e.touches || []).length !== 1) { startY = null; return; }
        startY = e.touches[0].clientY;
      } catch (err) { startY = null; }
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      try {
        if (startY === null || (e.touches || []).length !== 1) return;
        const dy = e.touches[0].clientY - startY;
        if (dy < 80) return;
        startY = null;
        if (!getToken() || (pinHashGet() && !pinSessionOk())) return;
        if (navModalOpen || document.getElementById('pin-lock')) return;
        try {
          const sc = document.getElementById('scan-overlay');
          if (sc && sc.style.display !== 'none') return;
        } catch (err) {}
        const ae = document.activeElement;
        if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName || '')) return;
        if ((window.scrollY || 0) > 0) return;
        if (refreshBusy) return;
        const cs = document.getElementById('conn-status');
        if (cs) cs.textContent = T('common.refreshing');
        refreshAll();
      } catch (err) {}
    }, { passive: true });
    window.addEventListener('touchend', () => { startY = null; }, { passive: true });
  } catch (e) {}
}
function apiPostRaw(path, body, method) {
  return fetchTimeout(API + path, { method: method || 'POST', headers: { 'Content-Type': 'application/json', ...HDR() }, body: JSON.stringify(body) })
    .then(async (r) => {
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.success) throw new Error(j.error || 'HTTP ' + r.status);
      return j;
    });
}
async function apiPost(path, body, method) {
  try { return await apiPostRaw(path, body, method); }
  catch (e) {
    if (!e || (e.name !== 'TypeError' && e.name !== 'AbortError')) throw e;
    queueOp(path, body, method);
    return { success: true, queued: true };
  }
}

// ---------- offline write queue ----------
const QUEUE_KEY = 'slpOfflineQueue';
let offlineQueue = [];
function loadQueue() {
  try { offlineQueue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch (e) { offlineQueue = []; }
  if (!Array.isArray(offlineQueue)) offlineQueue = [];
  updateQueueUI();
}
function saveQueue() { try { localStorage.setItem(QUEUE_KEY, JSON.stringify(offlineQueue)); } catch (e) {} }
function updateQueueUI() {
  const b = document.getElementById('offline-banner');
  const c = document.getElementById('pending-count');
  if (!b || !c) return;
  const n = offlineQueue.length;
  c.textContent = String(n);
  // The banner lays out with flex (gap + centering only work as flex).
  b.classList.toggle('hidden', n === 0);
  b.classList.toggle('flex', n > 0);
}
function queueOp(path, body, method) {
  offlineQueue.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 8), path, body, method: method || 'POST', at: new Date().toISOString() });
  saveQueue(); updateQueueUI();
}
let flushPromise = null;
async function flushQueue() {
  // Single-flight: concurrent triggers (WS + online event + manual sync)
  // share one run instead of interleaving replays.
  if (flushPromise) return flushPromise;
  flushPromise = (async () => {
    let synced = 0, failed = 0;
  while (offlineQueue.length) {
    const op = offlineQueue[0];
    try { await apiPostRaw(op.path, op.body, op.method); }
    catch (e) {
      // Still offline: keep everything, retry later. Rejected by the shop:
      // drop just that op (it can never succeed) so it stops blocking the rest.
      if (e && (e.name === 'TypeError' || e.name === 'AbortError')) break;
      diagPush('dropped-queue', (op.path || '') + ' ' + JSON.stringify(op.body || {}).slice(0, 200));
      offlineQueue.shift(); failed++;
      continue;
    }
    offlineQueue.shift(); synced++;
  }
  saveQueue(); updateQueueUI();
  if (synced) {
    toast(synced === 1 ? T('sync.synced_one') : T('sync.synced_many', { n: synced }), 'ok');
    refreshAll();
    if (offlineQueue.length) toast(T('sync.pending', { n: offlineQueue.length }), 'err');
  }
  if (failed) toast(T('sync.failed', { n: failed }), 'err');
  return synced;
  })().finally(() => { flushPromise = null; });
  return flushPromise;
}
async function syncNow() {
  let n = 0;
  try { n = await flushQueue(); } catch (e) {}
  if (!n) toast(T('sync.none'), 'err');
}

      if (vv && typeof vv.v === 'number') serverV = vv.v;
    } catch (e) {}
    const hasData = !!((data.inventory && data.inventory.length) || (data.clients && data.clients.length));
    if (serverV !== null && hasData && serverV === cachedDataVersion) return true;
    const [stats, inventory, transactions, expenses, suppliers, purchaseOrders, reports, settings, alerts] = await Promise.all([
      cashier ? null : apiGet('/api/stats'), apiGet('/api/inventory'), apiGet('/api/transactions?limit=100'),
      safeGet('/api/expenses', []), safeGet('/api/suppliers', []), safeGet('/api/purchase-orders', []),
      safeGet('/api/reports', null), safeGet('/api/settings', {}), safeGet('/api/alerts', { out: [], low: [], outCount: 0, lowCount: 0 })
    ]);
    const quickItems = await safeGet('/api/quick-items', []);
    data.stats = stats; data.inventory = inventory; data.transactions = transactions;
    data.expenses = expenses; data.suppliers = suppliers; data.purchaseOrders = purchaseOrders;
    data.reports = reports; data.settings = settings; data.alerts = alerts;
    data.quickItems = Array.isArray(quickItems) ? quickItems : [];
    if (serverV !== null) {
      cachedDataVersion = serverV;
      try { localStorage.setItem('slpDataV', JSON.stringify(serverV)); } catch (e) {}
    }
    await loadItemImages();
    await loadClients();
    if (offlineQueue.length) flushQueue();

  } catch (e) { setConn(false); return false; }
}

let ws = null; let wsAuthed = false;
let wsBackoffMs = 5000;
// Set when the shop rejects our token: retrying is pointless (and drains the
// battery) until a fresh pairing, which reloads the page and resets this.
let wsTokenDead = false;
// API may point at the shop computer while this page is bundled locally
// (native app) — derive the socket host from it, not from our own URL.
function serverLink() {
  try {
    const u = new URL(API);
    if (u.hostname) return { host: u.hostname, secure: u.protocol === 'https:' };
  } catch (e) {}
  return { host: window.location.hostname, secure: window.location.protocol === 'https:' };
}
function storedWsPort() {
  try { return localStorage.getItem('slpWsPort') || ''; } catch (e) { return ''; }
}
function wsRetryLater() {
  // Exponential backoff with jitter so a dead desktop doesn't keep every
  // phone hammering it: 5s → ~30s max. Reset on successful auth. Never
  // scheduled for a rejected token (fresh pairing reloads the page anyway).
  if (wsTokenDead) return;
  try {
    const jitter = Math.floor(Math.random() * 2000);
    setTimeout(connectWS, Math.min(wsBackoffMs, 30000) + jitter);
    wsBackoffMs = Math.min(Math.floor(wsBackoffMs * 1.5), 30000);
  } catch (e) {}
}
function connectWS() {
  const tok = getToken();
  if (!tok || wsTokenDead) return;
  const params = new URLSearchParams(window.location.search);
  const wsPort = params.get('ws') || storedWsPort() || '3458';
  const link = serverLink();
  const proto = link.secure ? 'wss' : 'ws';
  const url = proto + '://' + link.host + ':' + wsPort;
  try { ws = new WebSocket(url); } catch (e) { wsRetryLater(); return; }
  ws.onopen = () => { try { ws.send(JSON.stringify({ type: 'auth', token: getToken() })); } catch (e) {} };
  ws.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.type === 'auth-ok') { wsAuthed = true; wsBackoffMs = 5000; setConn(true); if (offlineQueue.length) flushQueue(); }
    else if (msg.type === 'auth-error') { wsTokenDead = true; try { ws.close(); } catch (e) {} }
    else if (msg.type === 'update') refreshAll();
  };
  ws.onclose = () => { wsAuthed = false; wsRetryLater(); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}

function popEl(el) {
  if (!el) return;
  el.classList.remove('badge-pop'); void el.offsetWidth; el.classList.add('badge-pop');
}
function updateCartUI() {
  const c = cart.reduce((s, i) => s + i.qty, 0);
  const btn = document.getElementById('cart-count');
  if (btn) { if (btn.textContent !== String(c)) { btn.textContent = c; popEl(btn); } }
  const badge = document.getElementById('cart-badge');
  if (badge) {
    const was = badge.textContent;
    badge.textContent = c;
    badge.classList.toggle('hidden', c === 0); badge.classList.toggle('flex', c > 0);
    if (c > 0 && was !== String(c)) popEl(badge);
  }
  if (currentView === 'sale' && navModalOpen) updateNavMeta('sale');
}

function markNavActive(view) {
  document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('active', b.getAttribute('data-nav') === view));
}
function updateNavMeta(view) {
  const meta = VIEW_META[view] || { title: 'View', sub: '' };
  const t = document.getElementById('sheet-title'); if (t) t.textContent = T(meta.title);
  const st = document.getElementById('sheet-sub');

function openNavModal(view) {
  navModalOpen = true;
  const m = document.getElementById('nav-modal'); if (m) m.style.display = 'flex';
  const sheetBody = document.getElementById('sheet-body');
  const v = document.getElementById('view');
  if (sheetBody && v && v.parentElement !== sheetBody) sheetBody.appendChild(v);
  try { document.body.style.overflow = 'hidden'; } catch (e) {}
  updateNavMeta(view);
  markNavActive(view);
}
function closeNavModal() {
  if (!navModalOpen) return;
  navModalOpen = false;
  const m = document.getElementById('nav-modal'); if (m) m.style.display = 'none';
  const slot = document.getElementById('main-slot');
  const v = document.getElementById('view');
  if (slot && v && v.parentElement !== slot) slot.appendChild(v);
  try { document.body.style.overflow = ''; } catch (e) {}
  currentView = 'home';
  markNavActive('home');
  renderHome();
}
function navTap(view) {
  if (view === 'home') {
    if (navModalOpen || currentView !== 'home') showView('home');
    return;
  }
  if (navModalOpen && currentView === view) { closeNavModal(); return; }
  showView(view);
}
function showView(view, arg) {
  currentView = view;
  // Cashier phones never render owner-only views (the server also 403s them).
  if (phoneRole() === 'cashier' && (view === 'reports' || view === 'expenses' || view === 'audit' || view === 'suppliers' || view === 'purchase-orders')) {
    toast(T('nav.owner_only'), 'err');
    view = 'home'; currentView = 'home';
  }
  if (view === 'home') {
    if (navModalOpen) { closeNavModal(); return; }
    markNavActive('home');
    renderHome();
  } else {
    if (!navModalOpen) openNavModal(view); else { updateNavMeta(view); markNavActive(view); }
    if (view === 'clients') renderClients();
    else if (view === 'catalog') renderCatalog(null);
    else if (view === 'sale') renderSale();
    else if (view === 'pay') renderPay(arg);
    else if (view === 'inventory') renderInventory();
    else if (view === 'transactions') renderTransactions();
    else if (view === 'expenses') renderExpenses();
    else if (view === 'suppliers') renderSuppliers();
    else if (view === 'purchase-orders') renderPOs();
    else if (view === 'reports') renderReports();
    else if (view === 'settings') renderSettings();
    else if (view === 'stocktake') renderStocktake();
    else if (view === 'audit') renderAudit();
    else if (view === 'help') renderHelp();
    else if (view === 'debts') renderDebts();
  }
  window.scrollTo(0, 0);
}

function T(key, vars) {

    ? LANG_STRINGS[lang][key]
    : (LANG_STRINGS.en[key] != null ? LANG_STRINGS.en[key] : key);
  if (vars) {
    for (const k of Object.keys(vars)) s = String(s).split('{' + k + '}').join(vars[k]);
  }
  return s;
}
function setPhoneLang(v) {

// Static shell labels (bottom nav, tablet nav) carry data-i18n keys.
function applyStaticLang() {
  try {

      if (k) el.textContent = T(k);

}

// ===== src/mobile/weather.js =====
// ---------- PHONE WEATHER + HOLIDAYS ----------
// Same sources as the desktop dashboard (wttr.in + nager.at with a built-in
// fallback list), shrunk to a home-screen card. Phone-specific differences:
// location lives in localStorage (per phone, no server round-trip) and the
// holiday cache too. Everything fails soft to cache/offline text — weather
// is a convenience, never a blocker. No imports/exports: concatenated.
const PH_HOLIDAYS_FALLBACK = {
  '01-01': "New Year's Day",
  '02-25': 'EDSA People Power Revolution',
  '04-09': 'Day of Valor',
  '05-01': 'Labor Day',
  '06-12': 'Independence Day',
  '08-21': 'Ninoy Aquino Day',
  '08-28': 'National Heroes Day',
  '11-01': "All Saints' Day",
  '11-02': "All Souls' Day",
  '11-30': 'Bonifacio Day',
  '12-08': 'Feast of the Immaculate Conception',
  '12-24': 'Christmas Eve',
  '12-25': 'Christmas Day',
  '12-30': 'Rizal Day',
  '12-31': "New Year's Eve"
};
function weatherEmoji(code) {
  const n = parseInt(code);
  if (n === 113) return '☀️';
  if (n >= 116 && n <= 119) return '⛅';
  if (n >= 122 && n <= 143) return '☁️';
  if (n >= 176 && n <= 200) return '🌧️';
  if (n >= 227 && n <= 230) return '🌨️';
  if (n >= 248 && n <= 260) return '🌫️';
  if (n >= 263 && n <= 389) return '⛈️';
  return '🌤️';
}
function weatherLocGet() {
  try { return localStorage.getItem('slpWeatherLoc') || 'Manila'; } catch (e) { return 'Manila'; }
}
function weatherLocSet(v) {
  try { localStorage.setItem('slpWeatherLoc', String(v || '').trim().slice(0, 60) || 'Manila'); } catch (e) {}
}
function weatherAutoGet() {
  try { return localStorage.getItem('slpWeatherAuto') === '1'; } catch (e) { return false; }
}
function weatherAutoSet(on) {
  try { localStorage.setItem('slpWeatherAuto', on ? '1' : '0'); } catch (e) {}
}
// Session-cached coordinates: one GPS fix per launch, not per render.
let _geoFix = null;
// Resolve the wttr.in location: GPS coords when auto mode is on, else the
// saved city. Never throws — always falls back to the saved city.
async function resolveWeatherLoc() {
  const fallback = weatherLocGet();
  if (!weatherAutoGet()) return { loc: fallback, auto: false };
  if (_geoFix) return { loc: _geoFix, auto: true };
  try {
    const G = (typeof nativePlugin === 'function') ? nativePlugin('Geolocation') : null;
    if (G && typeof G.getCurrentPosition === 'function') {
      try { if (typeof G.requestPermissions === 'function') await G.requestPermissions().catch(() => {}); } catch (e) {}
      const pos = await G.getCurrentPosition({ enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
      const lat = pos && pos.coords && pos.coords.latitude;
      const lon = pos && pos.coords && pos.coords.longitude;
      if (isFinite(lat) && isFinite(lon)) {
        _geoFix = lat + ',' + lon;
        return { loc: _geoFix, auto: true };
      }
    } else if (navigator.geolocation) {
      const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 10000, enableHighAccuracy: false, maximumAge: 300000 }));
      const lat = pos && pos.coords && pos.coords.latitude;
      const lon = pos && pos.coords && pos.coords.longitude;
      if (isFinite(lat) && isFinite(lon)) {
        _geoFix = lat + ',' + lon;
        return { loc: _geoFix, auto: true };
      }
    }
  } catch (e) {}
  return { loc: fallback, auto: false };
}
function weatherCacheGet() {
  try { return JSON.parse(localStorage.getItem('weatherCache') || 'null'); } catch (e) { return null; }
}
function weatherHTML(c, staleMin) {
  return `<div class="flex items-center gap-2"><div class="text-2xl">${weatherEmoji(c.ic)}</div><div class="min-w-0">`
    + `<p class="text-lg font-bold leading-tight num">${c.temp}°C</p>`
    + `<p class="text-xs text-gray-500 truncate">${esc(c.desc || '')}</p>`
    + `<p class="text-[11px] text-gray-400 truncate">${esc(c.city || '')}${staleMin > 30 ? ' · ' + staleMin + 'm ago' : ''}</p>`
    + `</div></div>`;
}
async function loadPhoneWeather() {
  const el = document.getElementById('weather-display');
  if (!el) return;
  const cache = weatherCacheGet();
  const now = Date.now();
  if (cache && cache.temp != null) {
    const ago = Math.round((now - (cache.ts || 0)) / 60000);
    el.innerHTML = weatherHTML(cache, ago);
    if (ago < 30) return;
  } else {
    el.innerHTML = '<p class="text-gray-400 text-xs py-2">Loading weather…</p>';
  }
  try {
    const got = await resolveWeatherLoc();
    const loc = got.loc;
    const res = await fetch('https://wttr.in/' + encodeURIComponent(loc) + '?format=j1');
    if (!res.ok) throw new Error('weather fetch failed');
    const data = await res.json();
    const c = (data.current_condition || [])[0] || {};
    const area = (data.nearest_area || [])[0] || {};
    const city = [(area.areaName || [])[0], (area.region || [])[0]].map(x => (x && x.value) || '').filter(Boolean).join(', ') || loc;
    const fresh = {
      temp: c.temp_C, desc: ((c.weatherDesc || [])[0] || {}).value || '',
      hum: c.humidity, wind: (c.wind_Kmph || '') + ' km/h ' + (c.windDir || ''),
      ic: c.weatherCode, city, ts: now
    };
    try { localStorage.setItem('weatherCache', JSON.stringify(fresh)); } catch (e) {}
    const box = document.getElementById('weather-display');
    if (box) box.innerHTML = weatherHTML(fresh, 0);
  } catch (e) {
    if (!cache || cache.temp == null) {
      const box = document.getElementById('weather-display');
      if (box) box.innerHTML = '<p class="text-xs text-gray-400 py-1">🌤 Weather needs internet</p>';
    }
  }
}
// Pure: next upcoming holiday on/after `today` (YYYY-MM-DD) from a list.
function nextHoliday(holidays, today) {
  const up = (holidays || []).filter(h => h && h.date >= today)
    .sort((a, b) => String(a.date).localeCompare(String(b.date)));
  return up[0] || null;
}
function holidayDaysAway(dateStr, today) {
  const ms = new Date(dateStr + 'T00:00:00').getTime() - new Date(today + 'T00:00:00').getTime();
  return Math.max(0, Math.round(ms / 86400000));
}
function fillFallbackHolidays(year, holidays) {
  const seen = new Set((holidays || []).map(h => h.date));
  const out = (holidays || []).slice();
  for (const mmdd of Object.keys(PH_HOLIDAYS_FALLBACK)) {
    const date = year + '-' + mmdd;
    if (!seen.has(date)) out.push({ date, localName: PH_HOLIDAYS_FALLBACK[mmdd], name: PH_HOLIDAYS_FALLBACK[mmdd] });
  }
  return out;
}
async function loadYearHolidays(year) {
  const key = 'slpHolidays_' + year;
  try {
    const kept = JSON.parse(localStorage.getItem(key) || 'null');
    if (Array.isArray(kept) && kept.length) return kept;
  } catch (e) {}
  try {
    const res = await fetch('https://date.nager.at/api/v3/publicholidays/' + year + '/PH');
    if (res.ok) {
      const list = fillFallbackHolidays(year, await res.json());
      try { localStorage.setItem(key, JSON.stringify(list)); } catch (e) {}
      return list;
    }
  } catch (e) {}
  return fillFallbackHolidays(year, []);
}
function localTodayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
async function loadPhoneHolidays() {
  const el = document.getElementById('next-holiday');
  if (!el) return;
  try {
    const y = new Date().getFullYear();
    const years = [y].concat(new Date().getMonth() >= 9 ? [y + 1] : []);
    let all = [];
    for (const yy of years) all = all.concat(await loadYearHolidays(yy));
    const nx = nextHoliday(all, localTodayStr());
    if (!nx) { el.innerHTML = '<p class="text-[11px] text-gray-500">No upcoming holidays</p>'; return; }
    const days = holidayDaysAway(nx.date, localTodayStr());
    el.innerHTML = `<button onclick="showPhoneHolidays()" class="w-full text-left">`
      + `<p class="text-sm font-bold text-gray-200 truncate">🎉 ${esc(nx.localName || nx.name || 'Holiday')}</p>`
      + `<p class="text-[11px] text-gray-500">${esc(nx.date)}${days === 0 ? ' · today!' : days === 1 ? ' · tomorrow' : ' · in ' + days + ' days'}</p></button>`;
  } catch (e) {
    el.innerHTML = '<p class="text-[11px] text-gray-500">Holidays unavailable offline</p>';
  }
}
async function showPhoneHolidays() {
  const y = new Date().getFullYear();
  const years = [y].concat(new Date().getMonth() >= 9 ? [y + 1] : []);
  let all = [];
  for (const yy of years) all = all.concat(await loadYearHolidays(yy));
  const today = localTodayStr();
  all.sort((a, b) => String(a.date).localeCompare(String(b.date)));
  document.getElementById('modal-root').innerHTML = `
    <div class="fixed inset-0 bg-black/70 z-[45] flex items-end sm:items-center justify-center fade-in" onclick="if(event.target===this)closeQuick()">

// ---------- BLANK DEBT FORM ----------
// Paper debt ledger, like the desktop's: pick columns + row count, get a
// printable form. Phone path: in-app preview, then the system share sheet
// (save PDF, send to a printer app, Drive) via a Documents HTML file.
// No imports/exports: concatenated.
const DEBT_FORM_COLS = [
  { key: 'date', label: 'Date' },
  { key: 'item', label: 'Item/Description' },
  { key: 'qty', label: 'Qty/Name' },
  { key: 'amount', label: 'Amount' },
  { key: 'payment', label: 'Payment' },
  { key: 'interest', label: 'Interest' },
  { key: 'balance', label: 'Balance' },
  { key: 'remarks', label: 'Remarks' },
  { key: 'signature', label: 'Signature' }
];
function getDebtFormCols() {
  try {
    const v = JSON.parse(localStorage.getItem('debtFormCols') || 'null');
    if (Array.isArray(v) && v.length) return v.filter(k => DEBT_FORM_COLS.some(c => c.key === k));
  } catch (e) {}
  return DEBT_FORM_COLS.map(c => c.key);
}
function getDebtRowCount() {
  try {
    const n = parseInt(localStorage.getItem('debtRowCount')) || 10;
    return Math.max(1, Math.min(99, n));
  } catch (e) { return 10; }
}
function setDebtRowCount(n) {
  try { localStorage.setItem('debtRowCount', String(Math.max(1, Math.min(99, parseInt(n) || 10)))); } catch (e) {}
}
// Pure: full printable HTML document. Tested in Node (test-debtform).
function buildDebtFormHTML(shopName, cols, rowCount, orientation, dateStr) {
  const pick = (Array.isArray(cols) && cols.length ? cols : DEBT_FORM_COLS.map(c => c.key))
    .map(k => DEBT_FORM_COLS.find(c => c.key === k)).filter(Boolean);
  const rows = Math.max(1, Math.min(99, parseInt(rowCount) || 10));
  const land = orientation === 'landscape';
  const cell = (tag, c, inner) => {
    const align = c.key === 'qty' || c.key === 'signature' ? 'center' : (['amount', 'payment', 'interest', 'balance'].includes(c.key) ? 'right' : 'left');
    return `<${tag} style="border:1px solid #0f172a;padding:${tag === 'th' ? '4px 3px' : '0'};text-align:${align};${tag === 'th' ? 'background:#1e293b;color:#fff;font-size:8px;' : 'height:24px;'}">${inner}</${tag}>`;
  };
  const head = `<tr><th style="border:1px solid #0f172a;padding:4px 3px;background:#1e293b;color:#fff;width:20px;font-size:8px">#</th>`
    + pick.map(c => cell('th', c, c.label)).join('') + '</tr>';
  let body = '';
  for (let i = 0; i < rows; i++) {
    body += `<tr><td style="border:1px solid #0f172a;text-align:center;font-size:9px;color:#64748b;padding:3px">${i + 1}</td>`
      + pick.map(c => cell('td', c, '')).join('') + '</tr>';
  }
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Debt Record Form</title>'
    + `<style>body{font-family:Arial,sans-serif;color:#0f172a;padding:16px;font-size:11px}table{width:100%;border-collapse:collapse;font-size:9px}tbody tr:nth-child(even) td{background:#f8fafc}@page{size:${land ? 'landscape' : 'portrait'};margin:10mm 12mm}</style></head><body>`
    + `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h2 style="font-size:14px;margin:0">Debt Record Form — ${esc(shopName || 'Shop Ledger PH')}</h2><span style="font-size:11px;color:#475569">Date: _______________</span></div>`
    + `<div style="margin-bottom:8px;font-size:12px">Client Name: <span style="display:inline-block;width:250px;border-bottom:1px solid #94a3b8">&nbsp;</span></div>`
    + `<table><thead>${head}</thead><tbody>${body}</tbody></table>`
    + `<div style="margin-top:8px;font-size:10px;display:flex;justify-content:space-between;color:#475569"><span>Prepared by: _________________</span><span><b>Total Amount: P__________</b></span><span>Date: ${String(dateStr || '')}</span></div>`
    + '</body></html>';
}
function openDebtFormSetup() {
  const saved = getDebtFormCols();

  document.getElementById('modal-root').innerHTML = `
    <div class="fixed inset-0 bg-black/70 z-[45] flex items-end sm:items-center justify-center fade-in" onclick="if(event.target===this)closeQuick()">
      <div class="w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-4 pb-6 slide-up glass-card" style="max-height:92dvh;overflow-y:auto" onclick="event.stopPropagation()">

        <p class="text-[11px] text-gray-500 mb-2">Columns to show:</p>
        <div class="grid grid-cols-2 gap-1 mb-3">
          ${DEBT_FORM_COLS.map(c => `<label class="flex items-center gap-2 text-sm p-1.5 rounded-xl cursor-pointer text-gray-300" style="background:rgba(255,255,255,.04)"><input type="checkbox" data-key="${c.key}" ${saved.includes(c.key) ? 'checked' : ''} onchange="debtFormColsChanged()" class="w-4 h-4" /><span>${c.label}</span></label>`).join('')}

          <button onclick="previewDebtForm('landscape')" class="btn btn-primary">Landscape</button>
        </div>
        <button onclick="closeQuick()" class="btn btn-ghost w-full mt-2">Cancel</button>
      </div>
    </div>`;
}
function debtFormColsChanged() {
  try {
    const keys = [...document.querySelectorAll('#modal-root input[data-key]:checked')].map(cb => cb.dataset.key);
    localStorage.setItem('debtFormCols', JSON.stringify(keys.length ? keys : DEBT_FORM_COLS.map(c => c.key)));
  } catch (e) {}
}
function debtFormRows(d) {
  const cur = getDebtRowCount();
  setDebtRowCount(cur + d);
  const el = document.getElementById('debt-form-rc');
  if (el) el.textContent = getDebtRowCount();
}
function previewDebtForm(orientation) {
  const s = (typeof data !== 'undefined' && data.settings) || {};
  const d = new Date();
  const today = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const html = buildDebtFormHTML(s.shopName, getDebtFormCols(), getDebtRowCount(), orientation, today);
  window.__lastDebtForm = html;
  const frame = `<iframe title="Debt form preview" sandbox="" srcdoc="${html.replace(/&/g, '&amp;').replace(/"/g, '&quot;')}" style="width:100%;height:52dvh;background:#fff;border-radius:.75rem;border:1px solid rgba(255,255,255,.1)"></iframe>`;
  document.getElementById('modal-root').innerHTML = `
    <div class="fixed inset-0 bg-black/70 z-[45] flex items-end sm:items-center justify-center fade-in" onclick="if(event.target===this)closeQuick()">
      <div class="w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-4 pb-6 slide-up glass-card" style="max-height:92dvh;overflow-y:auto" onclick="event.stopPropagation()">
        <div class="grabber mb-3" style="margin-bottom:.9rem"></div>
        <h3 class="font-bold text-gray-100 text-sm mb-3">Debt form (${orientation})</h3>
        ${frame}
        <div class="grid grid-cols-2 gap-2 mt-3">
          <button onclick="shareDebtForm()" class="btn btn-primary btn-sm">📤 Save / Print</button>
          <button onclick="openDebtFormSetup()" class="btn btn-ghost btn-sm">← Back</button>
        </div>
      </div>
    </div>`;
}
async function shareDebtForm() {
  const html = window.__lastDebtForm || '';
  if (!html) { toast('Nothing to share yet', 'err'); return; }
  const d = new Date();
  const name = 'debt-form-' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '.html';
  try {
    const F = nativePlugin('Filesystem');
    if (!F || typeof F.writeFile !== 'function') throw new Error('no fs');
    const w = await F.writeFile({ path: 'ShopLedger/forms/' + name, data: html, directory: 'DOCUMENTS', encoding: 'utf8', recursive: true });
    const uri = (w && w.uri) || '';
    try {
      const S = nativePlugin('Share');
      if (uri && S && typeof S.share === 'function') {
        await S.share({ title: 'Debt record form', text: 'Blank debt form ' + name, files: [uri], dialogTitle: 'Save debt form' });
        toast('Form shared', 'ok');
        return;
      }
    } catch (e) {}
    toast('Form saved to Documents/ShopLedger/forms/' + name, 'ok');
  } catch (e) { feelErr(); toast('Share failed: ' + (e && e.message), 'err'); }
}

function csvCell(v) {

  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;

async function exportClientsCsv() {
  const rows = [['Name', 'Phone', 'Address', 'Balance', 'Loyalty points']];
  for (const c of (data.clients || [])) {
    rows.push([c.name || '', c.phone || '', c.address || '', c.balance || 0, c.loyaltyPoints || 0]);
  }

  return true;

// Standalone-only CSV import (same columns as the export + desktop:
// Name, Phone, Address, Balance). Balances allowed — this is migration.
function parseCsvLine(line) {
  const out = [];
  let cur = '', inQ = false;
  for (let i = 0; i < (line || '').length; i++) {
    const ch = line[i];
    if (inQ) {
      if (ch === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else inQ = false;
      } else cur += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ',') { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(s => s.trim());
}
async function importClientsCsv() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.csv,text/csv';
  inp.onchange = async () => {
    const file = inp.files && inp.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
      if (lines.length < 2) { toast('Empty file', 'err'); return; }
      const hasHeader = /^"?name"?\s*,/i.test(lines[0]);
      const rows = (hasHeader ? lines.slice(1) : lines).map(l => {
        const p = parseCsvLine(l);
        return { name: p[0] || '', phone: p[1] || '', address: p[2] || '', balance: parseFloat(p[3]) || 0 };
      });
      const r = await apiPost('/api/clients/import', { clients: rows });
      feelSale();
      toast('Imported ' + (r.added || 0) + ((r.skipped || 0) ? ' (' + r.skipped + ' skipped)' : ''), 'ok');
      await refreshAll();
    } catch (e) { feelErr(); toast('Import failed: ' + e.message, 'err'); }
  };
  inp.click();
}

          <button onclick="quickSell(${id})" class="btn btn-success btn-lg"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>${T('quick.sell_now')}</button>

}
function quickStep(delta, id) {
  const item = itemById(id);
  if (!item) return;
  const max = item.stock || 0;
  qStepQty = Math.max(1, Math.min((qStepQty || 1) + delta, Math.max(1, max)));
  const q = document.getElementById('q-qty'); if (q) q.textContent = qStepQty;
  const s = document.getElementById('q-sub'); if (s) s.textContent = peso(item.price * qStepQty);
}
function closeQuick() { document.getElementById('modal-root').innerHTML = ''; qStepQty = 1; }
function quickAdd(id) {
  const item = itemById(id);
  if (!item) return;
  const qty = Math.max(1, Math.min(qStepQty || 1, item.stock || 1));
  const existing = cart.find(c => c.invId === id);
  if (existing) existing.qty = Math.min(existing.qty + qty, item.stock || existing.qty);
  else cart.push({ invId: id, name: item.name, qty, price: item.price });
  closeQuick();
  updateCartUI();
  toast(T('quick.added_cart', { name: item.name, qty: existing ? existing.qty : qty }), 'ok');
}
async function quickSell(id) {
  const item = itemById(id);
  if (!item) return;
  const stock = item.stock || 0;
  if (stock <= 0) return toast(T('home.out'), 'err');
  const qty = Math.max(1, Math.min(qStepQty || 1, stock));
  if (!takeSubmitLock('quick')) return;
  try {
    const r = await apiPost('/api/sales', {
      clientId: null, items: [{ name: String(qty), description: item.name, qty, unitCost: item.price, intRate: 0, invId: id }],
      paymentMethod: 'Cash', discount: 0
    });
    closeQuick();
    if (r.queued) toast(T('sale.queued'), 'ok');
    else { feelSale(); toast(T('sale.saved_ok', { inv: r.invoiceNo }), 'ok'); }
    await refreshAll();
  } catch (e) { feelErr(); toast(T('sale.fail_generic', { msg: e.message }), 'err'); }
  finally { releaseSubmitLock('quick'); }
}

// Preset the interest picker from the client's most recent rated sale
// (mirrors the desktop rate memory; the cashier can still change it).
function applyClientRate() {
  try {
    const sel = document.getElementById('sale-client');
    const id = sel && sel.value ? sel.value : null;
    const c = id && (data.clients || []).find(x => String(x.id) === String(id));
    const rate = (c && parseFloat(c.lastRate)) || 0;
    const box = document.getElementById('sale-interest');
    if (!box) return;
    let opt = [...box.options].find(o => parseFloat(o.value) === rate);
    if (!opt && rate > 0) {
      opt = document.createElement('option');
      opt.value = String(rate);
      opt.textContent = rate + '%';
      box.appendChild(opt);
    }
    box.value = String(rate);
    if (typeof saleTotals === 'function') saleTotals();
  } catch (e) {}
}
function saleTotals() {
  const sub = cart.reduce((s, i) => s + i.qty * i.price, 0);
  const rate = parseFloat(document.getElementById('sale-interest')?.value) || 0;
  const interest = sub * (rate / 100);
  const sc = (document.getElementById('sale-sc')?.checked) ? sub * 0.2 : 0;
  const disc = Math.max(0, parseFloat(document.getElementById('sale-discount')?.value) || 0) + sc;
  const total = Math.max(0, sub + interest - disc);
  const el = document.getElementById('sale-total'); if (el) el.textContent = peso(total);
  const se = document.getElementById('sale-sub'); if (se) se.textContent = peso(sub);
  lastSaleTotal = total;
  updateTender();
}
// Tender/change calculator state. Tendered persists across re-renders so
// stepping quantities mid-tender never wipes it; cleared on sale completion.
let tendered = 0;
let lastSaleTotal = 0;
let lastFailedSale = null;
function setTender(v) {
  tendered = Math.max(0, Number(v) || 0);
  const custom = document.getElementById('tender-custom');
  if (custom && document.activeElement !== custom) custom.value = tendered || '';
  updateTender();
}
function setTenderExact() { setTender(lastSaleTotal); }
function updateTender() {
  const tEl = document.getElementById('tendered-amt');
  const cEl = document.getElementById('tender-change');
  if (!tEl || !cEl) return;
  if (!(tendered > 0)) { tEl.textContent = '—'; cEl.textContent = '—'; cEl.className = 'font-bold num text-gray-400'; return; }
  tEl.textContent = peso(tendered);
  const change = tendered - (lastSaleTotal || 0);
  cEl.textContent = peso(change);
  cEl.className = 'font-bold num ' + (change >= 0 ? 'text-green-400' : 'text-red-400');
}
function cartStep(idx, delta) {
  const c = cart[idx]; if (!c) return;
  const stock = (itemById(c.invId)?.stock) || 9999;
  c.qty = Math.min(Math.max(1, c.qty + delta), Math.max(1, stock));
  updateCartUI();
  renderSale();
}
let cartRemoving = false;
function cartRemove(idx) {
  if (cartRemoving) return;
  const row = document.getElementById('mc-row-' + idx);
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (row && !reduceMotion) {
    cartRemoving = true;
    row.classList.add('row-out');
    setTimeout(() => { cartRemoving = false; cart.splice(idx, 1); updateCartUI(); renderSale(); }, 220);
  } else { cart.splice(idx, 1); updateCartUI(); renderSale(); }
}

async function submitSale() {
  if (!cart.length) return toast(T('sale.need_items'), 'err');
  if (!takeSubmitLock('sale')) return;
  const clientSel = document.getElementById('sale-client');
  const clientId = clientSel && clientSel.value ? parseInt(clientSel.value) : null;
  const charge = document.getElementById('sale-charge')?.checked;
  if (charge && !clientId) return toast(T('sale.need_client'), 'err');
  const rate = parseFloat(document.getElementById('sale-interest')?.value) || 0;
  const sc = (document.getElementById('sale-sc')?.checked) ? true : false;
  const discount = Math.max(0, parseFloat(document.getElementById('sale-discount')?.value) || 0);
  const paymentMethod = document.getElementById('sale-payment')?.value || 'Cash';
  const items = cart.map(i => ({ name: String(i.qty), description: i.name, qty: i.qty, unitCost: i.price, intRate: rate, invId: i.invId }));
  const disc = discount + (sc ? (items.reduce((s, i) => s + i.qty * i.unitCost, 0) * 0.2) : 0);
  const body = { clientId: charge ? clientId : null, items, paymentMethod, discount: disc };
  try {
    const r = await apiPost('/api/sales', body);
    if (r.queued) { lastFailedSale = null; tendered = 0; toast(T('sale.queued'), 'ok'); cart = []; updateCartUI(); showView('home'); await refreshAll(); return; }
    lastFailedSale = null; tendered = 0;
    saleSuccessSheet(r.invoiceNo);
  } catch (e) {
    // Cart is kept intact so nothing is lost; one tap retries the same payload.
    lastFailedSale = { clientId: charge ? clientId : null, items, paymentMethod, discount: disc };
    feelErr();
    toast(T('sale.failed_keep'), 'err');
    if (currentView === 'sale') renderSale();
  } finally { releaseSubmitLock('sale'); }
}
async function retrySale() {
  if (!lastFailedSale) return;
  if (!takeSubmitLock('sale')) return;
  toast(T('sale.retrying'), 'info');
  try {
    const r = await apiPost('/api/sales', lastFailedSale);
    if (r.queued) { lastFailedSale = null; tendered = 0; toast(T('sale.queued'), 'ok'); cart = []; updateCartUI(); showView('home'); await refreshAll(); return; }
    lastFailedSale = null; tendered = 0;
    saleSuccessSheet(r.invoiceNo);
  } catch (e) { feelErr(); toast(T('sale.still_failing', { msg: e.message }), 'err'); }
  finally { releaseSubmitLock('sale'); }
}

function counterAdd(id) {

  if (!item) return;
  if ((item.stock || 0) <= 0) { feelErr(); toast(T('sale.oos_item', { name: item.name }), 'err'); return; }
  const line = cart.find(c => c.invId === item.id);
  if (line) line.qty++;
  else cart.push({ invId: item.id, name: item.name, qty: 1, price: item.price || 0 });
  updateCartUI();
  feelAdd();
  const inp = document.getElementById('counter-search');
  if (inp) inp.value = '';

  if (box) box.innerHTML = '';

  const again = document.getElementById('counter-search');
  if (again) { try { again.focus(); } catch (e) {} }
}

// ---------- barcode scan-to-cart ----------
// Uses the phone camera + built-in BarcodeDetector (Chrome/Edge). Plain-http
// shop Wi-Fi blocks camera access (browser rule) — then Catalog search stays
// the way in, and the https/Tailscale link unlocks scanning.
let scanStream = null;
async function scanBarcodeNative() {
  // Native scanner (Capacitor app): full-screen camera UI with no https or
  // browser-support requirements, so it works on plain-http shop Wi-Fi.
  const B = nativePlugin('CapacitorBarcodeScanner') || nativePlugin('BarcodeScanner');
  if (!B || typeof B.scanBarcode !== 'function') return null;
  const r = await B.scanBarcode({ hint: 9, scanButton: false, scanText: 'Point at a product barcode' });
  return (r && (r.ScanResult || r.scanResult || '') || '').trim();
}
async function startBarcodeScan() {
  try {
    const native = await scanBarcodeNative();
    if (native) { scanToCart(native); return; }
  } catch (e) { /* fall through to the web flow */ }
  if (!('BarcodeDetector' in window)) { toast(T('scan.need_browser'), 'err'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast(T('scan.need_https'), 'err'); return; }
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  } catch (e) { toast(T('scan.blocked'), 'err'); return; }
  let ov = document.getElementById('scan-overlay');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'scan-overlay';
    ov.style.cssText = 'position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;';
    ov.innerHTML = `<video id="scan-video" playsinline muted style="flex:1;width:100%;object-fit:cover;"></video>
      <div style="padding:1rem;display:flex;gap:.5rem;background:#0f172a;align-items:center;">
        <div style="flex:1;color:#94a3b8;font-size:12px;">${T('scan.point')}</div>
        <button onclick="stopBarcodeScan()" class="btn btn-ghost"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>${T('scan.cancel')}</button>
      </div>`;
    document.body.appendChild(ov);
  } else ov.style.display = 'flex';
  const video = document.getElementById('scan-video');
  if (!video) { stopBarcodeScan(); return; }
  video.srcObject = scanStream;
  try { await video.play(); } catch (e) {}
  let det = null;
  try { det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'qr_code'] }); }
  catch (e) { toast(T('scan.no_formats'), 'err'); stopBarcodeScan(); return; }
  const loop = async () => {
    try {
      const cur = document.getElementById('scan-overlay');
      if (!cur || cur.style.display === 'none') return;
      const codes = await det.detect(video);
      if (codes && codes.length) { scanToCart(String(codes[0].rawValue || '')); return; }
    } catch (e) {}
    setTimeout(loop, 250);
  };
  loop();
}
function stopBarcodeScan() {
  try {
    const ov = document.getElementById('scan-overlay');
    if (ov) ov.style.display = 'none';
    const video = document.getElementById('scan-video');
    if (video) { try { video.pause(); } catch (e) {} video.srcObject = null; }
    if (scanStream) { scanStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} }); scanStream = null; }
  } catch (e) {}
}
function scanToCart(code) {
  code = (code || '').trim();
  if (!code) return;
  const item = (data.inventory || []).find(i => String(i.barcode || '') === code || String(i.sku || '').toLowerCase() === code.toLowerCase());
  stopBarcodeScan();
  if (!item) { toast(T('sale.no_product', { code }), 'err'); return; }
  if ((item.stock || 0) <= 0) { toast(T('sale.oos_item', { name: item.name }), 'err'); return; }
  const line = cart.find(c => c.invId === item.id);
  if (line) line.qty++;
  else cart.push({ invId: item.id, name: item.name, qty: 1, price: item.price || 0 });
  updateCartUI();
  feelAdd();
  toast(T('sale.added', { name: item.name }), 'ok');
  if (currentView === 'sale') renderSale();
}

// ---------- product photos ----------
// Phone camera → downscaled JPEG → catalog thumbnail. Works on plain http
// (file picker, not getUserMedia) and degrades without canvas support.
function photoForItem(id) {
  let inp = null;
  try {
    inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    try { inp.setAttribute('capture', 'environment'); } catch (e) {}
  } catch (e) { toast(T('photo.badtype'), 'err'); return; }
  inp.onchange = () => {
    try {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => downscalePhoto(String((rd.result) || ''), id);
      rd.onerror = () => toast(T('photo.failed', { msg: 'read error' }), 'err');
      rd.readAsDataURL(f);
    } catch (e) { toast(T('photo.failed', { msg: e.message }), 'err'); }
  };
  try { inp.click(); } catch (e) {}
}
function loadPhotoBitmap(dataUrl) {
  return new Promise((resolve, reject) => {
    try {
      if (typeof createImageBitmap === 'function' && typeof fetch === 'function') {
        fetch(dataUrl).then(r => r.blob()).then(b => createImageBitmap(b)).then(resolve, reject);
        return;
      }
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('decode'));
      img.src = dataUrl;
    } catch (e) { reject(e); }
  });
}
async function downscalePhoto(dataUrl, id) {
  const m = /^data:(image\/(png|jpe?g|webp|gif));base64,/.exec(dataUrl || '');
  if (!m) { feelErr(); toast(T('photo.badtype'), 'err'); return; }
  let out = dataUrl;
  const bmp = await loadPhotoBitmap(dataUrl).catch(() => null);
  if (bmp && bmp.width && bmp.height) {
    try {
      const scale = Math.min(1, 800 / Math.max(bmp.width, bmp.height));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(bmp.width * scale));
      cv.height = Math.max(1, Math.round(bmp.height * scale));
      cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
      out = cv.toDataURL('image/jpeg', 0.72);
    } catch (e) { /* keep the original bytes */ }
  }
  if (out.length > 650000) { feelErr(); toast(T('photo.toobig'), 'err'); return; }
  try {
    const r = await apiPost('/api/inventory/' + encodeURIComponent(id) + '/photo', { image: out });
    if (r && r.queued) { toast(T('photo.queued'), 'info'); return; }
    feelOk();
    toast(T('photo.saved'), 'ok');
    await refreshAll();
  } catch (e) { feelErr(); toast(T('photo.failed', { msg: e.message }), 'err'); }
}

async function submitExpense() {
  const description = (document.getElementById('ex-desc').value || '').trim();
  const amount = parseFloat(document.getElementById('ex-amount').value);
  const category = document.getElementById('ex-category').value;
  const date = document.getElementById('ex-date').value || new Date().toISOString().split('T')[0];
  const payee = (document.getElementById('ex-payee').value || '').trim();
  if (!amount || amount <= 0) return toast(T('exp.need_amount'), 'err');
  if (!takeSubmitLock('expense')) return;
  try {
    const r = await apiPost('/api/expenses', { description, amount, category, date, payee });
    closeQuick();
    if (r.queued) {
      data.expenses.push({ id: Date.now(), date, category, description, amount, payee, queued: true });
      if (currentView === 'expenses') renderExpenses();
      toast(T('exp.queued'), 'ok');
      return;
    }
    toast(T('exp.ok'), 'ok');
    await refreshAll();
  } catch (e) { toast(T('exp.failed', { msg: e.message }), 'err'); }
  finally { releaseSubmitLock('expense'); }

let expDelArmed = null;
async function deleteExpense(id) {
  if (expDelArmed !== id) {
    expDelArmed = id;
    toast(T('exp.delete_confirm'), 'info');
    setTimeout(() => { if (expDelArmed === id) expDelArmed = null; }, 5000);
    return;
  }
  expDelArmed = null;
  if (!takeSubmitLock('expdel')) return;
  try {
    await apiPost('/api/expenses/' + encodeURIComponent(id), {}, 'DELETE');
    toast(T('exp.deleted'), 'ok');
    await refreshAll();
  } catch (e) { toast(T('exp.failed', { msg: e.message }), 'err'); }
  finally { releaseSubmitLock('expdel'); }
}

function poAddItem() {
  const sel = document.getElementById('po-item');
  const opt = sel && sel.selectedIndex >= 0 ? sel.options[sel.selectedIndex] : null;
  if (!opt || !opt.value) return toast(T('po.select_item_err'), 'err');
  const invId = parseInt(opt.value);
  const name = opt.dataset.name || 'Item';
  const price = parseFloat(document.getElementById('po-price').value) || (parseFloat(opt.dataset.price) || 0);
  const qty = Math.max(1, parseInt(document.getElementById('po-qty').value) || 1);
  const existing = poItems.find(i => i.invId === invId);
  if (existing) { existing.qty += qty; existing.price = price; }
  else poItems.push({ invId, name, price, qty });
  poRenderCart();
  toast(T('po.added', { name, qty }), 'ok');
}
function poRenderCart() {
  const el = document.getElementById('po-cart');
  const t = document.getElementById('po-total-mobile');
  if (!el) return;
  if (!poItems.length) { el.innerHTML = `<p class="text-gray-500 text-xs px-1">${T('po.no_items')}</p>`; if (t) t.textContent = peso(0); return; }
  const total = poItems.reduce((s, i) => s + i.price * i.qty, 0);
  if (t) t.textContent = peso(total);
  el.innerHTML = poItems.map((i, idx) => `
    <div class="flex justify-between items-center py-1 border-b border-white/5 last:border-0 px-1">

    </div>`).join('');
}
function poRemoveItem(idx) { poItems.splice(idx, 1); poRenderCart(); }
async function submitPO() {
  if (!poItems.length) return toast(T('sale.need_items'), 'err');
  const supplierId = parseInt(document.getElementById('po-supplier').value) || null;
  if (!supplierId) return toast(T('po.need_supplier'), 'err');
  if (!takeSubmitLock('po')) return;
  try {
    if (editingPoId) {
      await apiPost('/api/purchase-orders/' + encodeURIComponent(editingPoId), { supplierId, items: poItems.map(i => ({ invId: i.invId, name: i.name, price: i.price, qty: i.qty })) }, 'PUT');
      closeQuick();
      poItems = []; editingPoId = null;
      toast('Order updated', 'ok');
    } else {
      const r = await apiPost('/api/purchase-orders', { supplierId, items: poItems.map(i => ({ invId: i.invId, name: i.name, price: i.price, qty: i.qty })), date: new Date().toISOString().split('T')[0] });
      closeQuick();
      poItems = [];
      if (r.queued) toast(T('po.queued'), 'ok');
      else toast(T('po.created', { po: r.poNo || '' }), 'ok');
    }
    await refreshAll();
  } catch (e) { toast(T('po.failed', { msg: e.message }), 'err'); }
  finally { releaseSubmitLock('po'); }
}
// Standalone-only: fix a pending order's lines (desktop LAN API is read-only
// for orders, so the button is gated at the call site).

  editingPoId = null;

function editPO(id) {
  const po = (data.purchaseOrders || []).find(p => String(p.id) === String(id));
  if (!po || po.status === 'Received') return;
  editingPoId = po.id;
  poItems = (po.items || []).map(i => ({ invId: i.invId || null, name: i.name || 'Item', price: i.price || 0, qty: i.qty || 1 }));
  addPO();
  poRenderCart();
  setTimeout(() => {
    try {
      const sel = document.getElementById('po-supplier');
      if (sel && po.supplierId) sel.value = String(po.supplierId);
      const btn = document.getElementById('po-submit-btn');
      if (btn && btn.lastChild) btn.lastChild.textContent = 'Save changes';
    } catch (e) {}
  }, 30);
}
