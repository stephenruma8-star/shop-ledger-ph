select.inp{appearance:none;-webkit-appearance:none;padding-right:2.2rem;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%2394a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');background-repeat:no-repeat;background-position:right .8rem center;background-size:.95rem}

<script>
const API = window.location.origin;
const peso = (n) => '₱' + (Number(n) || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
}
let data = { stats: null, clients: [], inventory: [], transactions: [], expenses: [], suppliers: [], purchaseOrders: [], reports: null, settings: {} };
let cart = [];
let currentView = 'home';

function getToken() {
  const m = window.location.search.match(/token=([^&]+)/);
  const urlToken = m ? m[1] : '';
  if (urlToken) { try { localStorage.setItem('slpToken', urlToken); } catch (e) {} }
  if (urlToken) return urlToken;
  try { return localStorage.getItem('slpToken') || ''; } catch (e) { return ''; }
}
const HDR = () => ({ 'X-Auth-Token': getToken() });

function toast(msg, type) {
  const root = document.getElementById('toast-root');
  if (!root) return;
  const el = document.createElement('div');
  el.className = (type === 'err' ? 'bg-red-600' : type === 'ok' ? 'bg-green-600' : 'bg-blue-600') + ' text-white text-sm px-4 py-3 rounded-xl shadow-xl border border-white/10 slide-in text-center';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => { try { el.remove(); } catch (e) {} }, 300); }, 2600);
}

async function apiGet(path) {
  const r = await fetch(API + path, { headers: HDR() });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function apiPostRaw(path, body) {
  return fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json', ...HDR() }, body: JSON.stringify(body) })
    .then(async (r) => {
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.success) throw new Error(j.error || 'HTTP ' + r.status);
      return j;
    });
}
async function apiPost(path, body) {
  try { return await apiPostRaw(path, body); }
  catch (e) {
    if (!e || e.name !== 'TypeError') throw e;
    queueOp(path, body);
    return { success: true, queued: true };
  }
}

// ---------- offline write queue ----------
const QUEUE_KEY = 'slpOfflineQueue';
let offlineQueue = [];
function loadQueue() {
  try { offlineQueue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch (e) { offlineQueue = []; }
  if (!Array.isArray(offlineQueue)) offlineQueue = [];
  updateQueueUI();
}
function saveQueue() { try { localStorage.setItem(QUEUE_KEY, JSON.stringify(offlineQueue)); } catch (e) {} }
function updateQueueUI() {
  const b = document.getElementById('offline-banner');
  const c = document.getElementById('pending-count');
  if (!b || !c) return;
  const n = offlineQueue.length;
  c.textContent = String(n);
  b.classList.toggle('hidden', n === 0);
}
function queueOp(path, body) {
  offlineQueue.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 8), path, body, at: new Date().toISOString() });
  saveQueue(); updateQueueUI();
}
async function flushQueue() {
  let synced = 0;
  while (offlineQueue.length) {
    const op = offlineQueue[0];
    try { await apiPostRaw(op.path, op.body); }
    catch (e) { break; }
    offlineQueue.shift(); synced++;
  }
  saveQueue(); updateQueueUI();
  if (synced) {
    toast(synced === 1 ? '1 change synced' : synced + ' changes synced', 'ok');
    refreshAll();
    if (offlineQueue.length) toast(offlineQueue.length + ' still pending — will retry', 'err');
  }
  return synced;
}
async function syncNow() {
  const n = await flushQueue();
  if (!n) toast('Still no connection — changes stay queued', 'err');
}

async function loadAll() {
  try {
    const safeGet = (p, fallback) => apiGet(p).catch(() => fallback);
    const [stats, inventory, transactions, expenses, suppliers, purchaseOrders, reports, settings] = await Promise.all([
      apiGet('/api/stats'), apiGet('/api/inventory'), apiGet('/api/transactions?limit=100'),
      safeGet('/api/expenses', []), safeGet('/api/suppliers', []), safeGet('/api/purchase-orders', []),
      safeGet('/api/reports', null), safeGet('/api/settings', {})
    ]);
    data.stats = stats; data.inventory = inventory; data.transactions = transactions;
    data.expenses = expenses; data.suppliers = suppliers; data.purchaseOrders = purchaseOrders;
    data.reports = reports; data.settings = settings;
    await loadClients();
    if (offlineQueue.length) flushQueue();
    return true;
  } catch (e) { setConn(false); return false; }
}
let lastClientsLoad = 0;
async function loadClients() {
  try { data.clients = await apiGet('/api/clients'); setConn(true); }
  catch (e) { setConn(false); }
}
function setConn(ok) {
  const el = document.getElementById('conn-status');
  if (el) el.textContent = ok ? '● Live' : '⚠ Offline — pulling latest data...';
  const dot = document.getElementById('conn-dot');
  if (dot) { dot.className = 'w-1.5 h-1.5 rounded-full inline-block ' + (ok ? 'bg-green-400' : 'bg-red-500'); }
}

let ws = null; let wsAuthed = false;
function connectWS() {
  const params = new URLSearchParams(window.location.search);
  const wsPort = params.get('ws') || '3458';
  const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
  const url = proto + '://' + window.location.hostname + ':' + wsPort;
  try { ws = new WebSocket(url); } catch (e) { setTimeout(connectWS, 5000); return; }
  ws.onopen = () => { try { ws.send(JSON.stringify({ type: 'auth', token: getToken() })); } catch (e) {} };
  ws.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.type === 'auth-ok') { wsAuthed = true; setConn(true); if (offlineQueue.length) flushQueue(); }
    else if (msg.type === 'update') refreshAll();
  };
  ws.onclose = () => { wsAuthed = false; setTimeout(connectWS, 5000); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}

let refreshBusy = false;
async function refreshAll() {
  if (refreshBusy) return; refreshBusy = true;
  try {
    await loadAll();
    if (currentView === 'home') renderHome();
    else if (currentView === 'clients') renderClients();
    else if (currentView === 'inventory') renderInventory();
    else if (currentView === 'transactions') renderTransactions();
    else if (currentView === 'catalog') renderCatalog(null);
    else if (currentView === 'sale') renderSale();
    else if (currentView === 'pay') renderPay();
    else if (currentView === 'expenses') renderExpenses();
    else if (currentView === 'suppliers') renderSuppliers();
    else if (currentView === 'purchase-orders') renderPOs();
    else if (currentView === 'reports') renderReports();
    else if (currentView === 'settings') renderSettings();
    toast('Refreshed', 'ok');
  } catch (e) { /* keep current view */ }
  refreshBusy = false;
}

function markNavActive(view) {
  document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('active', b.getAttribute('data-nav') === view));
}
function updateNavMeta(view) {
  const meta = VIEW_META[view] || { title: 'View', sub: '' };
  const t = document.getElementById('sheet-title'); if (t) t.textContent = meta.title;
  const st = document.getElementById('sheet-sub');
  if (st) {
    if (view === 'sale') {
      const n = cart.reduce((s, i) => s + i.qty, 0);
      st.textContent = n ? n + ' item' + (n === 1 ? '' : 's') + ' in cart' : meta.sub;
    } else st.textContent = meta.sub;
  }
}
function openNavModal(view) {
  navModalOpen = true;
  const m = document.getElementById('nav-modal'); if (m) m.style.display = 'flex';
  const sheetBody = document.getElementById('sheet-body');
  const v = document.getElementById('view');
  if (sheetBody && v && v.parentElement !== sheetBody) sheetBody.appendChild(v);
  try { document.body.style.overflow = 'hidden'; } catch (e) {}
  updateNavMeta(view);
  markNavActive(view);
}
function closeNavModal() {
  if (!navModalOpen) return;
  navModalOpen = false;
  const m = document.getElementById('nav-modal'); if (m) m.style.display = 'none';
  const slot = document.getElementById('main-slot');
  const v = document.getElementById('view');
  if (slot && v && v.parentElement !== slot) slot.appendChild(v);
  try { document.body.style.overflow = ''; } catch (e) {}
  currentView = 'home';
  markNavActive('home');
  renderHome();
}
function navTap(view) {
  if (view === 'home') {
    if (navModalOpen || currentView !== 'home') showView('home');
    return;
  }
  if (navModalOpen && currentView === view) { closeNavModal(); return; }
  showView(view);
}
function showView(view, arg) {
  currentView = view;
  if (view === 'home') {
    if (navModalOpen) { closeNavModal(); return; }
    markNavActive('home');
    renderHome();
  } else {
    if (!navModalOpen) openNavModal(view); else { updateNavMeta(view); markNavActive(view); }
    if (view === 'clients') renderClients();
    else if (view === 'catalog') renderCatalog(null);
    else if (view === 'sale') renderSale();
    else if (view === 'pay') renderPay(arg);
    else if (view === 'inventory') renderInventory();
    else if (view === 'transactions') renderTransactions();
    else if (view === 'expenses') renderExpenses();
    else if (view === 'suppliers') renderSuppliers();
    else if (view === 'purchase-orders') renderPOs();
    else if (view === 'reports') renderReports();
    else if (view === 'settings') renderSettings();
  }
  window.scrollTo(0, 0);
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeQuick(); if (navModalOpen) closeNavModal(); }
});

function quickStep(delta, id) {
  const item = itemById(id);
  if (!item) return;
  const max = item.stock || 0;
  qStepQty = Math.max(1, Math.min((qStepQty || 1) + delta, Math.max(1, max)));
  const q = document.getElementById('q-qty'); if (q) q.textContent = qStepQty;
  const s = document.getElementById('q-sub'); if (s) s.textContent = peso(item.price * qStepQty);
}
function closeQuick() { document.getElementById('modal-root').innerHTML = ''; qStepQty = 1; }
function quickAdd(id) {
  const item = itemById(id);
  if (!item) return;
  const qty = Math.max(1, Math.min(qStepQty || 1, item.stock || 1));
  const existing = cart.find(c => c.invId === id);
  if (existing) existing.qty = Math.min(existing.qty + qty, item.stock || existing.qty);
  else cart.push({ invId: id, name: item.name, qty, price: item.price });
  closeQuick();
  updateCartUI();
  toast('Added ' + item.name + ' ×' + (existing ? existing.qty : qty) + ' to cart', 'ok');
}
async function quickSell(id) {
  const item = itemById(id);
  if (!item) return;
  const stock = item.stock || 0;
  if (stock <= 0) return toast('Out of stock', 'err');
  const qty = Math.max(1, Math.min(qStepQty || 1, stock));
  try {
    const r = await apiPost('/api/sales', {
      clientId: null, items: [{ name: String(qty), description: item.name, qty, unitCost: item.price, intRate: 0, invId: id }],
      paymentMethod: 'Cash', discount: 0
    });
    closeQuick();
    if (r.queued) toast('Sale queued — will sync when online', 'ok');
    else toast('✅ Sale saved! ' + r.invoiceNo, 'ok');
    await refreshAll();
  } catch (e) { toast('Sale failed: ' + e.message, 'err'); }
}

  return '<option value="">Walk-in (no client)</option>' + data.clients.map(c => '<option value="' + c.id + '">' + esc(c.name) + ' — ' + peso(c.balance) + '</option>').join('');
}
function saleTotals() {
  const sub = cart.reduce((s, i) => s + i.qty * i.price, 0);
  const rate = parseFloat(document.getElementById('sale-interest')?.value) || 0;
  const interest = sub * (rate / 100);
  const sc = (document.getElementById('sale-sc')?.checked) ? sub * 0.2 : 0;
  const disc = Math.max(0, parseFloat(document.getElementById('sale-discount')?.value) || 0) + sc;
  const total = Math.max(0, sub + interest - disc);
  const el = document.getElementById('sale-total'); if (el) el.textContent = peso(total);
  const se = document.getElementById('sale-sub'); if (se) se.textContent = peso(sub);
}
function cartStep(idx, delta) {
  const c = cart[idx]; if (!c) return;
  const stock = (itemById(c.invId)?.stock) || 9999;
  c.qty = Math.min(Math.max(1, c.qty + delta), Math.max(1, stock));
  updateCartUI();
  renderSale();
}

function addManualItem() {
  const name = (document.getElementById('m-name').value || '').trim();
  const price = parseFloat(document.getElementById('m-price').value);
  const qty = parseInt(document.getElementById('m-qty').value) || 1;
  if (!name) { toast('Enter an item name', 'err'); return; }
  if (isNaN(price) || price < 0) { toast('Enter a valid price', 'err'); return; }
  cart.push({ invId: null, name, qty: Math.max(1, qty), price });
  closeQuick();
  updateCartUI();
  toast('Added ' + name + ' to cart', 'ok');
  if (currentView === 'sale') renderSale();
}
async function submitSale() {
  if (!cart.length) return toast('Add at least one item', 'err');
  const clientSel = document.getElementById('sale-client');
  const clientId = clientSel && clientSel.value ? parseInt(clientSel.value) : null;
  const charge = document.getElementById('sale-charge')?.checked;
  if (charge && !clientId) return toast('Select a client to charge', 'err');
  const rate = parseFloat(document.getElementById('sale-interest')?.value) || 0;
  const sc = (document.getElementById('sale-sc')?.checked) ? true : false;
  const discount = Math.max(0, parseFloat(document.getElementById('sale-discount')?.value) || 0);
  const paymentMethod = document.getElementById('sale-payment')?.value || 'Cash';
  const items = cart.map(i => ({ name: String(i.qty), description: i.name, qty: i.qty, unitCost: i.price, intRate: rate, invId: i.invId }));
  try {
    const disc = discount + (sc ? (items.reduce((s, i) => s + i.qty * i.unitCost, 0) * 0.2) : 0);
    const r = await apiPost('/api/sales', { clientId: charge ? clientId : null, items, paymentMethod, discount: disc });
    if (r.queued) toast('Sale queued — will sync when online', 'ok');
    else toast('✅ Sale saved! ' + r.invoiceNo, 'ok');
    cart = []; updateCartUI();
    showView('home'); await refreshAll();
  } catch (e) { toast('Sale failed: ' + e.message, 'err'); }
}

  v.innerHTML = skeleton('Loading&hellip;');
  if (!data.clients.length) await loadClients();
  v.innerHTML = `
    <div class="max-w-md mx-auto glass-card rounded-2xl p-4 fade-in">
      <div class="space-y-3.5">
        <div>
          <label class="text-[11px] font-semibold uppercase tracking-wider text-gray-500 block mb-1.5">Client</label>
          <select id="pay-client" class="inp">${data.clients.map(c => '<option value="' + c.id + '"' + (c.id === preselectedId ? ' selected' : '') + '>' + esc(c.name) + ' — ' + peso(c.balance) + '</option>').join('')}</select>
        </div>
        <div>
          <label class="text-[11px] font-semibold uppercase tracking-wider text-gray-500 block mb-1.5">Amount</label>
          <input id="pay-amount" type="number" step="0.01" placeholder="0.00" inputmode="decimal" class="inp text-2xl font-bold text-center num" style="height:3.5rem" />
        </div>
        <div class="grid grid-cols-4 gap-2">
          <button onclick="setAmt(100)" class="btn btn-ghost btn-sm">+₱100</button>
          <button onclick="setAmt(500)" class="btn btn-ghost btn-sm">+₱500</button>
          <button onclick="setAmt(1000)" class="btn btn-ghost btn-sm">+₱1000</button>
          <button onclick="setAmt('full')" class="btn btn-sm" style="background:rgba(59,130,246,.18);color:#60a5fa;border:1px solid rgba(59,130,246,.35)">Full</button>
        </div>
        <div>
          <label class="text-[11px] font-semibold uppercase tracking-wider text-gray-500 block mb-1.5">Method</label>
          <select id="pay-type" class="inp"><option>Cash</option><option>GCash</option><option>Maya</option><option>Bank Transfer</option></select>
        </div>
        <button onclick="submitPay()" class="btn btn-success btn-lg"><svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Record Bayad</button>
      </div>
    </div>`;
}
function setAmt(val) {
  const input = document.getElementById('pay-amount');
  if (!input) return;
  if (val === 'full') { const id = parseInt(document.getElementById('pay-client').value); const c = data.clients.find(x => x.id === id); input.value = c ? (c.balance || 0).toFixed(2) : ''; }
  else input.value = ((parseFloat(input.value) || 0) + val).toFixed(2);
}
async function submitPay() {
  const clientId = parseInt(document.getElementById('pay-client').value);
  const amount = parseFloat(document.getElementById('pay-amount').value);
  const type = document.getElementById('pay-type').value;
  if (!clientId || !amount) return toast('Fill in client and amount', 'err');
  try {
    const r = await apiPost('/api/payments', { clientId, amount, type, date: new Date().toISOString().split('T')[0] });
    if (r.queued) toast('Bayad queued — will sync when online', 'ok');
    else toast('✅ Bayad recorded!', 'ok');
    showView('home'); await refreshAll();
  } catch (e) { toast('Error: ' + e.message, 'err'); }
}

async function submitExpense() {
  const description = (document.getElementById('ex-desc').value || '').trim();
  const amount = parseFloat(document.getElementById('ex-amount').value);
  const category = document.getElementById('ex-category').value;
  const date = document.getElementById('ex-date').value || new Date().toISOString().split('T')[0];
  const payee = (document.getElementById('ex-payee').value || '').trim();
  if (!amount || amount <= 0) return toast('Enter a valid amount', 'err');
  try {
    const r = await apiPost('/api/expenses', { description, amount, category, date, payee });
    closeQuick();
    if (r.queued) {
      data.expenses.push({ id: Date.now(), date, category, description, amount, payee, queued: true });
      if (currentView === 'expenses') renderExpenses();
      toast('Expense queued — will sync when online', 'ok');
      return;
    }
    toast('✅ Expense recorded!', 'ok');
    await refreshAll();
  } catch (e) { toast('Error: ' + e.message, 'err'); }
}

            <h3 class="font-bold text-gray-100 text-sm">New Purchase Order</h3>
          </div>
          <button onclick="closeQuick()" class="w-9 h-9 rounded-xl btn-ghost flex items-center justify-center text-gray-400"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>

              <input id="po-qty" type="number" min="1" value="1" class="inp w-16 text-center" />
              <input id="po-price" type="number" min="0" step="0.01" placeholder="Price" class="inp w-24" />
            </div>
          </div>

}
function poAddItem() {
  const sel = document.getElementById('po-item');
  const opt = sel && sel.selectedIndex >= 0 ? sel.options[sel.selectedIndex] : null;
  if (!opt || !opt.value) return toast('Select an item', 'err');
  const invId = parseInt(opt.value);
  const name = opt.dataset.name || 'Item';
  const price = parseFloat(document.getElementById('po-price').value) || (parseFloat(opt.dataset.price) || 0);
  const qty = Math.max(1, parseInt(document.getElementById('po-qty').value) || 1);
  const existing = poItems.find(i => i.invId === invId);
  if (existing) { existing.qty += qty; existing.price = price; }
  else poItems.push({ invId, name, price, qty });
  poRenderCart();
  toast('Added ' + name + ' ×' + qty, 'ok');
}
function poRenderCart() {
  const el = document.getElementById('po-cart');
  const t = document.getElementById('po-total-mobile');
  if (!el) return;
  if (!poItems.length) { el.innerHTML = '<p class="text-gray-500 text-xs px-1">No items added</p>'; if (t) t.textContent = peso(0); return; }
  const total = poItems.reduce((s, i) => s + i.price * i.qty, 0);
  if (t) t.textContent = peso(total);
  el.innerHTML = poItems.map((i, idx) => `
    <div class="flex justify-between items-center py-1 border-b border-white/5 last:border-0 px-1">
      <span class="truncate">${esc(i.name)} <span class="text-gray-500">x${i.qty} @ ${peso(i.price)}</span></span>
      <span class="flex items-center gap-2"><span class="font-medium num">${peso(i.price * i.qty)}</span><button onclick="poRemoveItem(${idx})" class="text-red-400 p-1"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></span>
    </div>`).join('');
}
function poRemoveItem(idx) { poItems.splice(idx, 1); poRenderCart(); }
async function submitPO() {
  if (!poItems.length) return toast('Add at least one item', 'err');
  const supplierId = parseInt(document.getElementById('po-supplier').value) || null;
  if (!supplierId) return toast('Select a supplier', 'err');
  try {
    const r = await apiPost('/api/purchase-orders', { supplierId, items: poItems.map(i => ({ invId: i.invId, name: i.name, price: i.price, qty: i.qty })), date: new Date().toISOString().split('T')[0] });
    closeQuick();
    poItems = [];
    if (r.queued) toast('PO queued — will sync when online', 'ok');
    else toast('✅ PO created! ' + (r.poNo || ''), 'ok');
    await refreshAll();
  } catch (e) { toast('Error: ' + e.message, 'err'); }
}

// ---------- init ----------
(async () => {
  try {
    const proto = window.location.protocol;
    const host = window.location.hostname;
    if ('serviceWorker' in navigator && (proto === 'https:' || host === 'localhost')) {
      navigator.serviceWorker.register('/mobile-sw.js').catch(() => {});
    }
  } catch (e) { /* PWA upgrade path unavailable on plain http - app still works */ }
  loadQueue();
  window.addEventListener('online', () => { if (offlineQueue.length) flushQueue(); });
  await loadAll();
  const ls = document.getElementById('loading-screen');
  if (ls) ls.classList.add('hidden');
  showView('home');
  connectWS();
  setInterval(() => { /* keep WS alive */ }, 25000);
})();
</script>
