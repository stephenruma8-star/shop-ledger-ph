// Debt aging buckets + per-client sales, computed on-device from cached data.
function arAgingHTML() {
  const today = new Date().toISOString().split('T')[0];
  const buckets = [
    { key: 'rep.ar_current', total: 0 },
    { key: 'rep.ar_30', total: 0 },
    { key: 'rep.ar_60', total: 0 },
    { key: 'rep.ar_over', total: 0 }
  ];
  for (const c of (data.clients || [])) {
    const bal = c.balance || 0;
    if (bal <= 0) continue;
    let idx = 0;
    if (c.dueDate && c.dueDate < today) {
      const days = Math.floor((new Date(today + 'T00:00:00') - new Date((c.dueDate || '') + 'T00:00:00')) / 86400000);
      idx = days <= 30 ? 1 : days <= 60 ? 2 : 3;
    }
    buckets[idx].total += bal;
  }
  if (!buckets.some(b => b.total > 0)) return '';
  return `
    <section class="glass-card rounded-2xl p-3 mb-3 fade-in">
      <h3 class="card-title mb-2">${T('rep.ar_title')}</h3>
      ${buckets.map(b => `
      <div class="flex justify-between text-sm py-1">
        <span class="text-gray-400">${T(b.key)}</span>
        <span class="num font-semibold ${b.total > 0 ? 'text-orange-400' : 'text-gray-500'}">${peso(b.total)}</span>
      </div>`).join('')}
    </section>`;
}
function salesByClientHTML() {
  const byClient = {};
  for (const t of (data.transactions || [])) {
    if (t.status === 'voided') continue;
    const nm = t.clientName || 'Walk-in';
    byClient[nm] = byClient[nm] || { name: nm, total: 0, count: 0 };
    byClient[nm].total += t.grandTotal || 0;
    byClient[nm].count++;
  }
  const rows = Object.values(byClient).sort((a, b) => b.total - a.total).slice(0, 8);
  if (!rows.length) return '';
  return `
    <section class="glass-card rounded-2xl p-3 fade-in">
      <h3 class="card-title mb-2">${T('rep.sbc')}</h3>
      ${rows.map(r => `
      <div class="flex justify-between text-sm py-1 gap-2">
        <span class="text-gray-200 truncate">${esc(r.name)} <span class="text-gray-500">· ${r.count}</span></span>
        <span class="num font-semibold shrink-0 ${r.total < 0 ? 'text-red-400' : 'text-green-400'}">${peso(r.total)}</span>
      </div>`).join('')}
    </section>`;
}
function monthKey(d) {  try {
    const dt = d instanceof Date ? d : new Date(d);
    if (isNaN(dt)) return '';
    return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
  } catch (e) { return ''; }
}
async function loadReportMonth() {
  const inp = document.getElementById('rep-month');
  const m = ((inp && inp.value) || '').trim();
  if (!/^\d{4}-\d{2}$/.test(m)) return;
  try {
    const r = await apiGet('/api/reports?month=' + m);
    if (r) { data.reports = r; renderReports(); }
  } catch (e) { toast(T('rep.load_fail', { m, msg: e.message }), 'err'); }
}
function exportMonthCsv() {
  const inp = document.getElementById('rep-month');
  const m = ((inp && inp.value) || '').trim() || monthKey(new Date());
  if (!/^\d{4}-\d{2}$/.test(m)) return;
  // Standalone: build the CSV on-device and share it (no server download).
  if (typeof IS_STANDALONE !== 'undefined' && IS_STANDALONE) {
    exportMonthCsvLocal(m);
    return;
  }
  const tok = getToken();
  if (!tok) { renderPairScreen(); return; }
  // The CSV downloads through the system browser (auth travels in the URL,
  // same as the QR links) and opens straight into Excel/Sheets.
  const url = API + '/api/reports/export.csv?month=' + m + '&token=' + encodeURIComponent(tok);
  toast(T('rep.opening'), 'info');
  try {
    const B = nativePlugin('Browser');
    if (B && typeof B.open === 'function') { B.open({ url }).catch(() => {}); return; }
  } catch (e) {}
  try { window.open(url, '_blank'); } catch (e) { toast(T('upd.open_fail'), 'err'); }
}
async function exportMonthCsvLocal(m) {
  try {
    const r = await apiGet('/api/reports/export.csv?month=' + m);
    if (!r || !r.csv) throw new Error('empty report');
    await shareText('ShopLedger-' + m + '.csv', r.csv);
  } catch (e) { toast(T('rep.load_fail', { m, msg: e.message }), 'err'); }
}

  const s = data.settings || {};
  const L = [];
  L.push((s.shopName || 'Shop Ledger PH') + ' — ' + (r.monthStr || ''));

}

  await shareText('Daily closing ' + today, L.join('\n'));

  const vals = {
    shopName: ((document.getElementById('se-name') || {}).value || '').trim(),
    shopAddress: ((document.getElementById('se-address') || {}).value || '').trim(),
    shopContact: ((document.getElementById('se-contact') || {}).value || '').trim(),

  };

    const th = document.getElementById('se-thermal');
    if (th) vals.thermalHost = (th.value || '').trim().slice(0, 40);
    const tp = document.getElementById('se-thermalport');
    if (tp) vals.thermalPort = String(Math.min(65535, Math.max(1, parseInt(tp.value) || 9100)));
    const vr = document.getElementById('se-vat');
    if (vr) vals.vatRate = String(Math.min(100, Math.max(0, parseFloat(vr.value) || 0)));
    const pp = document.getElementById('se-ppp');
    if (pp) vals.pointsPerPeso = String(Math.max(0, parseFloat(pp.value) || 0));

  if (!vals.shopName) { toast(T('set.need_name'), 'err'); return; }
  if (!takeSubmitLock('shopedit')) return;
  try {

    toast(T('set.shop_saved'), 'ok');

// ---------- STOCKTAKE (shelf counting) ----------
// Walk the shelves, count what is really there, save once. Only touched
// items are updated; every change is audit-logged with this phone's name.
let stocktakeTouched = {};
async function renderStocktake() {
  const v = document.getElementById('view');
  if (!data.inventory.length) { v.innerHTML = skeleton(T('common.loading')); await loadAll(); }
  stocktakeTouched = {};
  v.innerHTML = `
    <div class="flex items-center justify-between gap-2 mb-3 fade-in">
      <h2 class="card-title text-base"><span class="icon-tile bg-teal-500/15 text-teal-400"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>${T('view.stocktake.title')}</h2>
      <span class="chip chip-blue" id="st-progress">${T('st.counted', { n: 0 })}</span>
    </div>
    <div class="relative mb-3 fade-in">
      <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="st-search" type="text" placeholder="${esc(T('st.search_ph'))}" oninput="filterStocktake(this.value)" autocomplete="off" class="inp pl-10" />
    </div>
    <div class="grid gap-2.5 fade-in" id="st-grid">${stocktakeListHTML(data.inventory)}</div>
    <button onclick="submitStocktake()" class="btn btn-primary btn-lg mt-3"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><polyline points="20 6 9 17 4 12"/></svg>${T('st.save')}</button>
    <p class="text-[11px] text-gray-500 text-center mt-2">${T('st.note')}</p>`;
}
function stocktakeCounted(item) {
  if (Object.prototype.hasOwnProperty.call(stocktakeTouched, item.id)) return stocktakeTouched[item.id];
  return item.stock || 0;
}
function stocktakeListHTML(items) {
  return items.map(i => {
    const sys = i.stock || 0;
    const counted = stocktakeCounted(i);
    const diff = counted - sys;
    return `
    <div class="glass-card rounded-2xl p-3 row">
      <span class="w-10 h-10 rounded-xl overflow-hidden bg-gray-800 border border-white/10 flex items-center justify-center shrink-0">${itemImage(i) ? '<img src="' + itemImage(i) + '" alt="" class="w-full h-full object-cover" loading="lazy" />' : '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>'}</span>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-medium truncate text-gray-200">${esc(i.name)}</div>
        <div class="text-[11px] text-gray-500">system: <span class="font-semibold text-gray-300">${sys}</span></div>
      </div>
      <button onclick="photoForItem(${JSON.stringify(i.id)})" title="${esc(T('photo.take'))}" class="btn btn-ghost btn-sm px-2 shrink-0">📷</button>
      <div class="flex items-center gap-1 shrink-0">
        <button onclick='stocktakeStep(${JSON.stringify(i.id)},-1)' class="w-8 h-8 rounded-lg font-bold text-gray-200" style="background:rgba(30,41,59,.6);border:1px solid rgba(255,255,255,.09)">−</button>
        <span id="st-c-${esc(String(i.id))}" class="w-9 text-center text-sm font-bold text-gray-100 num">${counted}</span>
        <button onclick='stocktakeStep(${JSON.stringify(i.id)},1)' class="w-8 h-8 rounded-lg font-bold text-gray-200" style="background:rgba(30,41,59,.6);border:1px solid rgba(255,255,255,.09)">+</button>
      </div>
      <span id="st-d-${esc(String(i.id))}" class="text-[11px] font-bold num w-12 text-right ${diff === 0 ? 'text-gray-500' : diff > 0 ? 'text-green-400' : 'text-red-400'}">${diff === 0 ? '—' : (diff > 0 ? '+' : '') + diff}</span>
    </div>`;
  }).join('');
}
function stocktakePaint(id) {
  try {
    const item = (data.inventory || []).find(i => i.id === id);
    if (!item) return;
    const sys = item.stock || 0;
    const counted = stocktakeCounted(item);
    const diff = counted - sys;
    const c = document.getElementById('st-c-' + id);
    if (c) c.textContent = counted;
    const d = document.getElementById('st-d-' + id);
    if (d) {
      d.textContent = diff === 0 ? '—' : (diff > 0 ? '+' : '') + diff;
      d.className = 'text-[11px] font-bold num w-12 text-right ' + (diff === 0 ? 'text-gray-500' : diff > 0 ? 'text-green-400' : 'text-red-400');
    }
    const p = document.getElementById('st-progress');
    if (p) { const n = Object.keys(stocktakeTouched).length; p.textContent = T('st.counted', { n }); }
  } catch (e) {}
}
function stocktakeStep(id, d) {
  const item = (data.inventory || []).find(i => i.id === id);
  if (!item) return;
  stocktakeTouched[id] = Math.max(0, stocktakeCounted(item) + d);
  feelAdd();
  stocktakePaint(id);
}
function stocktakeInput(id, val) {
  const item = (data.inventory || []).find(i => i.id === id);
  if (!item) return;
  const n = parseInt(val, 10);
  if (isNaN(n) || n < 0) return;
  stocktakeTouched[id] = Math.min(999999, n);
  stocktakePaint(id);
}
function filterStocktake(q) {
  q = (q || '').toLowerCase();
  const g = document.getElementById('st-grid');
  if (g) g.innerHTML = stocktakeListHTML((data.inventory || []).filter(i => ((i.name || '') + ' ' + (i.sku || '') + ' ' + (i.barcode || '')).toLowerCase().includes(q)));
}
async function submitStocktake() {
  const changes = Object.keys(stocktakeTouched).map(k => {
    const item = (data.inventory || []).find(i => String(i.id) === String(k));
    if (!item) return null;
    const counted = stocktakeTouched[k];
    if (counted === (item.stock || 0)) return null;
    return { id: item.id, name: item.name, stock: counted };
  }).filter(Boolean);
  if (!changes.length) { toast(T('st.no_diff'), 'info'); return; }
  let okCount = 0;
  const errors = [];
  for (const c of changes) {
    try {
      await apiPost('/api/inventory/adjust', { id: c.id, stock: c.stock });
      okCount++;
    } catch (e) { errors.push(c.name + ': ' + e.message); }
  }
  stocktakeTouched = {};
  if (okCount) feelSale();
  else feelErr();
  toast(okCount ? (okCount === 1 ? T('st.saved_one') : T('st.saved_many', { n: okCount })) : T('st.none'), okCount ? 'ok' : 'err');
  if (errors.length) toast(errors.slice(0, 2).join('; ') + (errors.length > 2 ? ` (+${errors.length - 2} ${T('st.more')})` : ''), 'err');
  await refreshAll();
  if (currentView === 'stocktake') renderStocktake();
}

      <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="audit-search" type="text" placeholder="${esc(T('aud.search_ph'))}" oninput="filterAudit(this.value)" autocomplete="off" class="inp pl-10" />
    </div>
    <div class="grid gap-2 fade-in" id="audit-list">${auditListHTML(auditList)}</div>`;
}
function auditActionColor(a) {
  a = String(a || '');
  if (/^sale|^payment|^po$|^supplier-payment|^print/.test(a)) return 'text-green-400';
  if (/failed|error|delete|void|revoke/.test(a)) return 'text-red-400';
  if (/stocktake|inventory|expense/.test(a)) return 'text-amber-400';
  return 'text-blue-400';
}
function auditTime(ts) {
  try {
    const d = new Date(ts);
    if (isNaN(d)) return String(ts || '');
    return d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric' }) + ' ' +
      d.toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit' });
  } catch (e) { return String(ts || ''); }
}
function auditListHTML(items) {
  if (!items.length) return `<div class="text-center text-gray-500 py-10"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mx-auto mb-2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><p class="text-sm">${T('aud.empty')}</p></div>`;
  return items.map(l => `
    <div class="glass-card rounded-xl px-3 py-2.5">
      <div class="flex items-center gap-2">
        <span class="text-[11px] font-bold ${auditActionColor(l.action)} shrink-0">${esc(l.action || 'event')}</span>
        <span class="text-[11px] text-gray-500 ml-auto shrink-0">${esc(auditTime(l.createdAt))}</span>
      </div>
      <div class="text-xs text-gray-300 mt-0.5 break-words">${esc(l.details || '')}</div>
    </div>`).join('');
}
function filterAudit(q) {
  q = (q || '').toLowerCase();
  const g = document.getElementById('audit-list');
  if (g) g.innerHTML = auditListHTML((auditList || []).filter(l => ((l.action || '') + ' ' + (l.details || '')).toLowerCase().includes(q)));
}

// Standalone-only daily interest (same math as the desktop): accrues each
// debtor's own rate over the days since the last run. Same-day reruns apply
// nothing; first run only stamps the date.
async function applyInterestNow() {
  if (!takeSubmitLock('interest')) return;
  toast('Applying daily interest…', 'info');
  try {
    const r = await apiPost('/api/interest/apply', {});
    feelOk();
    if (r && r.applied > 0) toast('Interest applied to ' + r.applied + ' client(s) over ' + (r.days || 0) + ' day(s)', 'ok');
    else toast('Nothing to apply', 'ok');

  } catch (e) { feelErr(); toast('Interest failed: ' + e.message, 'err'); }
  finally { releaseSubmitLock('interest'); }
}

// ===== src/mobile/update.js =====
// ---------- phone app updates ----------
// Sideloaded APKs have no auto-update: this checks the GitHub releases for a
// newer mobile APK (at most once a day, plus on demand from Settings) and
// hands the download to the system browser, which installs it like any
// sideloaded file. Silent unless an update is actually available.
const UPDATE_CHECK_KEY = 'slpUpdateCheck';
const UPDATE_CHECK_MS = 24 * 60 * 60 * 1000;
const RELEASES_URL = 'https://api.github.com/repos/stephenruma8-star/shop-ledger-ph/releases/latest';
function cmpAppVer(a, b) {
  const pa = String(a || '').split('.').map(x => parseInt(x, 10) || 0);
  const pb = String(b || '').split('.').map(x => parseInt(x, 10) || 0);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) < (pb[i] || 0) ? -1 : 1;
  }
  return 0;
}
async function bundledAppVersion() {
  // Native build version first; else the synced snapshot stamp. Empty when
  // unknown (plain browser without a snapshot) — the check stays silent then.
  try {
    const App = nativePlugin('App');
    if (App && typeof App.getInfo === 'function') {
      const info = await App.getInfo();
      if (info && info.version) return String(info.version);
    }
  } catch (e) {}
  try {
    const r = await fetch('version.json', { cache: 'no-store' });
    if (r.ok) {
      const v = await r.json().catch(() => null);
      if (v && v.desktopVersion) return String(v.desktopVersion);
    }
  } catch (e) {}
  return '';
}
async function fetchLatestRelease() {
  try {
    const r = await fetchTimeout(RELEASES_URL, { headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) return null;
    return await r.json().catch(() => null);
  } catch (e) { return null; }
}
function findApkAsset(rel) {
  const assets = (rel && rel.assets) || [];
  const hit = assets.find(a => /Shop-Ledger-Mobile-.*\.apk$/i.test(a.name || ''));
  return hit && hit.browser_download_url ? { name: hit.name, url: hit.browser_download_url } : null;
}
async function checkMobileUpdate(manual) {
  try {
    if (!manual) {
      let last = 0;
      try { last = Number(localStorage.getItem(UPDATE_CHECK_KEY) || 0); } catch (e) {}
      if (last && Date.now() - last < UPDATE_CHECK_MS) return 'throttled';
    }
    try { localStorage.setItem(UPDATE_CHECK_KEY, String(Date.now())); } catch (e) {}
    const cur = await bundledAppVersion();
    if (!cur) return 'unknown';
    const rel = await fetchLatestRelease();
    if (!rel) return 'unknown';
    const tag = String(rel.tag_name || '').replace(/^v/, '');
    const apk = findApkAsset(rel);
    if (!tag || !apk) return 'unknown';
    if (cmpAppVer(tag, cur) <= 0) return 'updated';
    renderUpdateSheet(tag, apk.url);
    return 'available';
  } catch (e) { return 'unknown'; }
}
async function checkMobileUpdateNow() {
  toast(T('upd.checking'), 'info');
  const r = await checkMobileUpdate(true);
  if (r === 'updated') toast(T('upd.uptodate'), 'ok');
  else if (r === 'unknown' || r === 'throttled') toast(T('upd.unknown'), 'err');
  // 'available' renders its own sheet.
}
let pendingUpdateUrl = '';
function renderUpdateSheet(tag, url) {
  // The URL rides in a variable, never in HTML: escaping download links
  // mangles their query strings.
  pendingUpdateUrl = url;
  document.getElementById('modal-root').innerHTML = `
    <div class="fixed inset-0 bg-black/70 z-[45] flex items-end sm:items-center justify-center fade-in" onclick="if(event.target===this)closeQuick()">
      <div class="w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 pb-6 slide-up glass-card text-center">
        <div class="text-4xl mb-2">⬆️</div>
        <div class="text-lg font-bold text-gray-100 mb-1">${T('upd.title')}</div>
        <p class="text-xs text-gray-400 mb-4">${T('upd.body', { tag })}</p>
        <button onclick="downloadPendingUpdate()" class="btn btn-primary btn-lg mb-2">${T('upd.download')}</button>
        <button onclick="closeQuick()" class="btn btn-ghost btn-lg">${T('upd.later')}</button>
      </div>
    </div>`;
  feelOk();
}
async function downloadPendingUpdate() {
  const u = pendingUpdateUrl;
  pendingUpdateUrl = '';
  await downloadMobileUpdate(u);
}
async function downloadMobileUpdate(url) {
  if (!url) return;
  try {
    const B = nativePlugin('Browser');
    if (B && typeof B.open === 'function') {
      await B.open({ url });
      closeQuick();
      toast(T('upd.downloading'), 'ok');
      return;
    }
  } catch (e) {}
  try { window.open(url, '_blank'); closeQuick(); } catch (e) { toast(T('upd.open_fail'), 'err'); }
}
async function updateUpdateRow() {
  const box = document.getElementById('update-row');
  if (!box) return;
  box.innerHTML = `<p class="text-[11px] text-gray-500">${T('set.checking')}</p>`;
  const cur = await bundledAppVersion();
  box.innerHTML = `
    <div class="text-[11px] text-gray-500 mb-2">${T('set.this_app')}<strong class="text-gray-300">${esc(cur || 'unknown')}</strong></div>
    <button onclick="checkMobileUpdateNow()" class="w-full py-2.5 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-500">${T('set.check_updates')}</button>`;
}

// ===== src/mobile/app.js =====
// ---------- init ----------
async function startApp() {
  await loadAll();
  if (!getToken()) return; // session expired mid-boot; pair screen already shown
  applyRoleGating();
  applyBrand();
  const ls = document.getElementById('loading-screen');
  if (ls) ls.classList.add('hidden');
  showView('home');
  connectWS();
  setInterval(() => { /* keep WS alive */ }, 25000);
  watchPinActivity(); armAutoLock();
  setupNativeBack();
  checkMobileUpdate(false);
  uploadDiagnostics(false);
}
// Android back button: peel UI layers instead of killing the app.
function setupNativeBack() {
  try {
    const App = nativePlugin('App');
    if (!App || typeof App.addListener !== 'function') return;
    App.addListener('backButton', () => {
      try {
        const sc = document.getElementById('scan-overlay');
        if (sc && sc.style.display !== 'none') { stopBarcodeScan(); return; }
        if (document.getElementById('pin-lock')) return; // locked stays locked
        if (navModalOpen) { closeNavModal(); return; }
        const mr = document.getElementById('modal-root');
        if (mr && mr.firstChild) { closeQuick(); return; }
        if (typeof App.minimizeApp === 'function') App.minimizeApp();
      } catch (e) {}
    });
  } catch (e) {}
}
(async () => {
  try {
    const proto = window.location.protocol;
    const host = window.location.hostname;
    // No service worker inside the native shell (custom scheme) or on plain
    // http — the app still works, it just always loads fresh from the shop.
    if ('serviceWorker' in navigator && !isNativeApp() && (proto === 'https:' || host === 'localhost')) {
      navigator.serviceWorker.register('/mobile-sw.js').catch(() => {});
    }
  } catch (e) { /* PWA upgrade path unavailable on plain http - app still works */ }
  applyDisplayPrefs();
  applyStaticLang();
  setupPullRefresh();
  setupDiagHook();
  if (!getToken()) { renderPairScreen(); return; }
  loadQueue();
  window.addEventListener('online', () => { if (offlineQueue.length) flushQueue(); });
  if (pinHashGet() && !pinSessionOk()) { renderPinLock(true); return; }
  await startApp();
})();
</script>
