<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9}
.fade-in{animation:fadeIn .2s ease-out}@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.slide-in{animation:slideIn .25s ease-out}@keyframes slideIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.scale-in{animation:scaleIn .2s ease-out}@keyframes scaleIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.glow{animation:glow 2s ease-in-out infinite alternate}@keyframes glow{from{box-shadow:0 0 4px rgba(59,130,246,.3)}to{box-shadow:0 0 12px rgba(59,130,246,.5)}}
.text-glow{animation:textGlow 2s ease-in-out infinite alternate}@keyframes textGlow{from{text-shadow:0 0 4px rgba(59,130,246,.3)}to{text-shadow:0 0 12px rgba(59,130,246,.6),0 0 20px rgba(59,130,246,.2)}}
.pulse-soft{animation:pulseSoft 2s ease-in-out infinite}@keyframes pulseSoft{0%,100%{opacity:1}50%{opacity:.7}}
.shimmer{background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);background-size:200% 100%;animation:shimmer 2s infinite}@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.card-hover{transition:transform .2s ease,box-shadow .2s ease}.card-hover:active{transform:scale(.99)}
.login-bg{background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#1d4ed8 100%)}
.glass{background:rgba(30,41,59,.88)!important;border:1px solid rgba(255,255,255,.08)!important}
.glass-nav{background:rgba(15,23,42,.95)!important;border-right:1px solid rgba(255,255,255,.06)!important}
.glass-header{background:rgba(15,23,42,.9)!important;border-bottom:1px solid rgba(255,255,255,.06)!important}
.glass-card{background:rgba(30,41,59,.8)!important;border:1px solid rgba(255,255,255,.06)!important}
.glass-input{background:rgba(30,41,59,.6)!important;border:1px solid rgba(255,255,255,.08)!important}
.glass-input:focus{background:rgba(30,41,59,.75)!important;border-color:rgba(59,130,246,.5)!important}
.btn-glass{background:rgba(37,99,235,.85)!important;border:1px solid rgba(59,130,246,.4)!important}
.btn-glass:hover{background:rgba(37,99,235,.95)!important;border-color:rgba(59,130,246,.6)!important}
.stat-card{background:rgba(30,41,59,.8)!important;border:1px solid rgba(255,255,255,.06)!important}
.nav-btn.active{background:rgba(59,130,246,.18)!important;color:#60a5fa!important}
.bnav-btn.active{color:#60a5fa!important}
.bnav-btn.active::before{content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:24px;height:3px;border-radius:9999px;background:#3b82f6;box-shadow:0 0 8px rgba(59,130,246,.7)}
.conn-online{color:#22c55e}.conn-offline{color:#ef4444}.conn-checking{color:#f59e0b;animation:connPulse 1.2s ease-in-out infinite}
@keyframes connPulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet{animation:slideUp .25s ease}
::-webkit-scrollbar{width:0;height:0}
body{background-image:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(59,130,246,.15),transparent),radial-gradient(ellipse 60% 40% at 90% 110%,rgba(29,78,216,.12),transparent)}
</style>

<div id="modal-root"></div>
<div id="toast-root" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 space-y-2 w-[92%] max-w-sm"></div>

<script>
const API = window.location.origin;
const peso = (n) => '₱' + (Number(n) || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
}
let data = { stats: null, clients: [], inventory: [], transactions: [] };
let cart = []; // {invId, name, qty, price}
let currentView = 'home';
let cacheBust = 0;

function getToken() {
  const m = window.location.search.match(/token=([^&]+)/);
  const urlToken = m ? m[1] : '';
  if (urlToken) { try { localStorage.setItem('slpToken', urlToken); } catch (e) {} }
  if (urlToken) return urlToken;
  try { return localStorage.getItem('slpToken') || ''; } catch (e) { return ''; }
}
const HDR = () => ({ 'X-Auth-Token': getToken() });

function toast(msg, type) {
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = (type === 'err' ? 'bg-red-600' : type === 'ok' ? 'bg-green-600' : 'bg-blue-600') + ' text-white text-sm px-4 py-3 rounded-xl shadow-xl border border-white/10 slide-in';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2600);
}

async function apiGet(path) {
  const r = await fetch(API + path, { headers: HDR() });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function apiPost(path, body) {
  const r = await fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json', ...HDR() }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.success) throw new Error(j.error || 'HTTP ' + r.status);
  return j;
}

async function loadAll() {
  try {
    const [stats, inventory, transactions] = await Promise.all([
      apiGet('/api/stats'), apiGet('/api/inventory'), apiGet('/api/transactions?limit=100')
    ]);
    data.stats = stats; data.inventory = inventory; data.transactions = transactions;
    await loadClients();
    return true;
  } catch (e) { setConn(false); return false; }
}
let lastClientsLoad = 0;
async function loadClients() {
  try { data.clients = await apiGet('/api/clients'); setConn(true); }
  catch (e) { setConn(false); }
}
function setConn(ok) {
  const el = document.getElementById('conn-status');
  if (el) el.textContent = ok ? '● Live' : '⚠ Offline — pulling latest data...';
  const dot = document.getElementById('conn-dot');
  if (dot) { dot.className = 'w-1.5 h-1.5 rounded-full inline-block ' + (ok ? 'bg-green-400' : 'bg-red-500'); }
}

// ---------- WebSocket live updates ----------
let ws = null; let wsAuthed = false;
function connectWS() {
  const params = new URLSearchParams(window.location.search);
  const wsPort = params.get('ws') || '3458';
  const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
  const url = proto + '://' + window.location.hostname + ':' + wsPort;
  try { ws = new WebSocket(url); } catch (e) { setTimeout(connectWS, 5000); return; }
  ws.onopen = () => { try { ws.send(JSON.stringify({ type: 'auth', token: getToken() })); } catch (e) {} };
  ws.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.type === 'auth-ok') { wsAuthed = true; setConn(true); }
    else if (msg.type === 'update') refreshAll();
  };
  ws.onclose = () => { wsAuthed = false; setTimeout(connectWS, 5000); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}

let refreshBusy = false;
async function refreshAll() {
  if (refreshBusy) return; refreshBusy = true;
  try { await loadAll(); if (currentView === 'home') renderHome(); else if (currentView === 'clients') renderClients(); else if (currentView === 'inventory') renderInventory(); else if (currentView === 'transactions') renderTransactions(); else if (currentView === 'catalog') renderCatalog(null); }
  catch (e) { /* keep current view */ }
  refreshBusy = false;
}

function showView(view, arg) {
  currentView = view;
  document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('active', b.getAttribute('data-nav') === view));
  const v = document.getElementById('view');
  if (view === 'home') renderHome();
  else if (view === 'clients') renderClients();
  else if (view === 'catalog') renderCatalog(null);
  else if (view === 'sale') renderSale();
  else if (view === 'pay') renderPay(arg);
  else if (view === 'inventory') renderInventory();
  else if (view === 'transactions') renderTransactions();
  window.scrollTo(0, 0);
}

function updateCartUI() {
  const c = cart.reduce((s, i) => s + i.qty, 0);
  const btn = document.getElementById('cart-count');
  if (btn) btn.textContent = c;
  const badge = document.getElementById('cart-badge');
  if (badge) { badge.textContent = c; badge.classList.toggle('hidden', c === 0); badge.classList.toggle('flex', c > 0); }
}

// ---------- HOME ----------
async function renderHome() {
  const v = document.getElementById('view');
  v.innerHTML = '<div class="text-center text-gray-400 py-16 fade-in"><div class="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>Loading dashboard...</div>';
  if (!data.stats) await loadAll();
  const s = data.stats || {};
  const lowStockTop = data.inventory.filter(i => (i.stock || 0) <= (i.lowStock || 5)).sort((a, b) => a.stock - b.stock).slice(0, 4);
  const recent = (s.recent || []).slice(0, 4);
  v.innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 sm:gap-3 fade-in">
      <div class="stat-card p-3 sm:p-4 rounded-xl card-hover hover:ring-2 hover:ring-green-500/40">
        <div class="text-xs text-gray-400">Today's Sales</div>
        <div class="text-xl md:text-2xl font-bold text-green-400">${peso(s.todaySales)}</div>
        <div class="text-[11px] text-orange-400 font-medium">Profit ${peso(s.todayProfit)}</div>
      </div>
      <div class="stat-card p-3 sm:p-4 rounded-xl card-hover hover:ring-2 hover:ring-red-500/40">
        <div class="text-xs text-gray-400">Total Utang</div>
        <div class="text-xl md:text-2xl font-bold text-orange-400">${peso(s.totalUtang)}</div>
        <div class="text-[11px] text-green-400 font-medium">Collected ${peso(s.todayCollected)}</div>
      </div>
      <div class="stat-card p-3 sm:p-4 rounded-xl card-hover hover:ring-2 hover:ring-blue-500/40">
        <div class="text-xs text-gray-400">Month Sales</div>
        <div class="text-xl md:text-2xl font-bold text-blue-400">${peso(s.monthSales)}</div>
        <div class="text-[11px] text-red-400 font-medium">Expenses ${peso(s.monthExpenses)}</div>
      </div>
      <div class="stat-card p-3 sm:p-4 rounded-xl card-hover cursor-pointer hover:ring-2 hover:ring-amber-500/40" onclick="showView('inventory')">

          <button onclick="quickSell(${id})" class="py-3 bg-green-600 hover:bg-green-500 text-white rounded-xl font-semibold shadow-lg flex items-center justify-center gap-1.5">Sell Now</button>

        <button onclick="closeQuick()" class="w-full mt-2 py-2 text-gray-500 text-sm hover:text-gray-300">Close</button>
      </div>

}
let qStepQty = 1;
function quickStep(delta, id) {
  const item = itemById(id);
  if (!item) return;
  const max = item.stock || 0;
  qStepQty = Math.max(1, Math.min((qStepQty || 1) + delta, Math.max(1, max)));
  const q = document.getElementById('q-qty'); if (q) q.textContent = qStepQty;
  const s = document.getElementById('q-sub'); if (s) s.textContent = peso(item.price * qStepQty);
}
function closeQuick() { document.getElementById('modal-root').innerHTML = ''; qStepQty = 1; }
function quickAdd(id) {
  const item = itemById(id);
  if (!item) return;
  const qty = Math.max(1, Math.min(qStepQty || 1, item.stock || 1));
  const existing = cart.find(c => c.invId === id);
  if (existing) existing.qty = Math.min(existing.qty + qty, item.stock || existing.qty);
  else cart.push({ invId: id, name: item.name, qty, price: item.price });
  closeQuick();
  updateCartUI();
  toast('Added ' + item.name + ' ×' + (existing ? existing.qty : qty) + ' to cart', 'ok');
}
async function quickSell(id) {
  const item = itemById(id);
  if (!item) return;
  const stock = item.stock || 0;
  if (stock <= 0) return toast('Out of stock', 'err');
  const qty = Math.max(1, Math.min(qStepQty || 1, stock));
  try {
    const r = await apiPost('/api/sales', {
      clientId: null, items: [{ name: String(qty), description: item.name, qty, unitCost: item.price, intRate: 0, invId: id }],
      paymentMethod: 'Cash', discount: 0
    });
    closeQuick();
    toast('✅ Sale saved! ' + r.invoiceNo, 'ok');
    await refreshAll();
  } catch (e) { toast('Sale failed: ' + e.message, 'err'); }
}

function saleTotals() {
  const sub = cart.reduce((s, i) => s + i.qty * i.price, 0);
  const rate = parseFloat(document.getElementById('sale-interest')?.value) || 0;
  const interest = sub * (rate / 100);
  const sc = (document.getElementById('sale-sc')?.checked) ? sub * 0.2 : 0;
  const disc = Math.max(0, parseFloat(document.getElementById('sale-discount')?.value) || 0) + sc;
  const total = Math.max(0, sub + interest - disc);
  const el = document.getElementById('sale-total'); if (el) el.textContent = peso(total);
  const se = document.getElementById('sale-sub'); if (se) se.textContent = peso(sub);
}
function cartStep(idx, delta) {
  const c = cart[idx]; if (!c) return;
  const stock = (itemById(c.invId)?.stock) || 9999;
  c.qty = Math.min(Math.max(1, c.qty + delta), Math.max(1, stock));
  updateCartUI();
  renderSale();
}
function cartRemove(idx) { cart.splice(idx, 1); updateCartUI(); renderSale(); }
function manualItem() {
  const form = prompt('Enter: Name, Price, Qty (e.g. "Candies, 5, 2")');
  if (!form) return;
  const parts = form.split(',').map(s => s.trim());
  const name = parts[0]; const price = parseFloat(parts[1]); const qty = parseInt(parts[2]) || 1;
  if (!name || !price) { toast('Invalid format', 'err'); return; }
  cart.push({ invId: null, name, qty, price });
  updateCartUI();
  renderSale();
}
async function submitSale() {
  if (!cart.length) return toast('Add at least one item', 'err');
  const clientSel = document.getElementById('sale-client');
  const clientId = clientSel && clientSel.value ? parseInt(clientSel.value) : null;
  const charge = document.getElementById('sale-charge')?.checked;
  if (charge && !clientId) return toast('Select a client to charge', 'err');
  const rate = parseFloat(document.getElementById('sale-interest')?.value) || 0;
  const sc = (document.getElementById('sale-sc')?.checked) ? true : false;
  const discount = Math.max(0, parseFloat(document.getElementById('sale-discount')?.value) || 0);
  const paymentMethod = document.getElementById('sale-payment')?.value || 'Cash';
  const items = cart.map(i => ({ name: String(i.qty), description: i.name, qty: i.qty, unitCost: i.price, intRate: rate, invId: i.invId }));
  try {
    const disc = discount + (sc ? (items.reduce((s, i) => s + i.qty * i.unitCost, 0) * 0.2) : 0);
    const r = await apiPost('/api/sales', { clientId: charge ? clientId : null, items, paymentMethod, discount: disc });
    toast('✅ Sale saved! ' + r.invoiceNo, 'ok');
    cart = []; updateCartUI();
    showView('home'); await refreshAll();
  } catch (e) { toast('Sale failed: ' + e.message, 'err'); }
}

// ---------- PAY ----------
async function renderPay(preselectedId) {
  const v = document.getElementById('view');
  v.innerHTML = '<div class="text-center text-gray-400 py-16 fade-in"><div class="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>Loading...</div>';
  if (!data.clients.length) await loadClients();
  v.innerHTML = `
    <div class="max-w-md mx-auto glass-card rounded-xl p-4 fade-in">
      <h2 class="text-xl font-bold text-gray-100 mb-3 flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Record Bayad</h2>
      <div class="space-y-3">
        <div><label class="text-xs text-gray-500 block mb-1">Client</label>
          <select id="pay-client" class="w-full px-3 py-3 rounded-xl glass-input text-sm bg-gray-900">${data.clients.map(c => '<option value="' + c.id + '"' + (c.id === preselectedId ? ' selected' : '') + '>' + esc(c.name) + ' — ' + peso(c.balance) + '</option>').join('')}</select>
        </div>
        <div><label class="text-xs text-gray-500 block mb-1">Amount</label>
          <input id="pay-amount" type="number" step="0.01" placeholder="0.00" class="w-full px-3 py-3 rounded-xl glass-input text-2xl font-bold text-center text-gray-100" />
        </div>
        <div class="grid grid-cols-4 gap-2">
          <button onclick="setAmt(100)" class="py-2.5 glass-input rounded-xl text-sm font-semibold text-gray-300 hover:bg-gray-700">+₱100</button>
          <button onclick="setAmt(500)" class="py-2.5 glass-input rounded-xl text-sm font-semibold text-gray-300 hover:bg-gray-700">+₱500</button>
          <button onclick="setAmt(1000)" class="py-2.5 glass-input rounded-xl text-sm font-semibold text-gray-300 hover:bg-gray-700">+₱1000</button>
          <button onclick="setAmt('full')" class="py-2.5 bg-blue-600/25 text-blue-300 rounded-xl text-sm font-bold hover:bg-blue-600/40">Full</button>
        </div>
        <div><label class="text-xs text-gray-500 block mb-1">Method</label>
          <select id="pay-type" class="w-full px-3 py-3 rounded-xl glass-input text-sm bg-gray-900"><option>Cash</option><option>GCash</option><option>Maya</option><option>Bank Transfer</option></select>
        </div>
        <button onclick="submitPay()" class="w-full py-4 bg-green-600 hover:bg-green-500 text-white rounded-xl font-bold text-lg shadow-xl flex items-center justify-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Record Bayad</button>
      </div>
    </div>`;
}
function setAmt(val) {
  const input = document.getElementById('pay-amount');
  if (val === 'full') { const id = parseInt(document.getElementById('pay-client').value); const c = data.clients.find(x => x.id === id); input.value = c ? (c.balance || 0).toFixed(2) : ''; }
  else input.value = ((parseFloat(input.value) || 0) + val).toFixed(2);
}
async function submitPay() {
  const clientId = parseInt(document.getElementById('pay-client').value);
  const amount = parseFloat(document.getElementById('pay-amount').value);
  const type = document.getElementById('pay-type').value;
  if (!clientId || !amount) return toast('Fill in client and amount', 'err');
  try {
    await apiPost('/api/payments', { clientId, amount, type, date: new Date().toISOString().split('T')[0] });
    toast('✅ Bayad recorded!', 'ok');
    showView('home'); await refreshAll();
  } catch (e) { toast('Error: ' + e.message, 'err'); }
}

// ---------- INVENTORY ----------
async function renderInventory() {
  const v = document.getElementById('view');
  if (!data.inventory.length) { v.innerHTML = '<div class="text-center text-gray-400 py-16 fade-in"><div class="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>Loading...</div>'; await loadAll(); }
  const low = data.inventory.filter(i => (i.stock || 0) <= (i.lowStock || 5)).length;
  v.innerHTML = `
    <div class="flex items-center justify-between mb-3 fade-in">
      <h2 class="text-xl font-bold text-gray-100 flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>Inventory <span class="text-sm text-gray-500 font-normal">(${data.inventory.length} items)</span></h2>
      <span class="text-xs font-bold ${low > 0 ? 'bg-amber-500/15 text-amber-400 px-2.5 py-1 rounded-full border border-amber-500/30' : 'bg-green-500/15 text-green-400 px-2.5 py-1 rounded-full border border-green-500/30'}">${low > 0 ? low + ' low stock' : 'All stocked'}</span>
    </div>
    <div class="relative mb-3 fade-in">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="inv-search" type="text" placeholder="Search..." oninput="filterInventory(this.value)" class="w-full pl-10 pr-4 py-2.5 rounded-xl glass-input text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-2 sm:gap-3 fade-in" id="inv-grid">${invListHTML(data.inventory)}</div>`;
}
function invListHTML(items) {
  return items.map(i => {
    const stock = i.stock || 0;
    return `
    <div class="glass-card rounded-xl p-3 flex items-center gap-3 card-hover">
      <span class="w-12 h-12 rounded-xl overflow-hidden flex items-center justify-center bg-gray-800 shrink-0 border border-white/10">${i.image ? '<img src="' + i.image + '" class="w-full h-full object-cover" />' : '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>'}</span>
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-sm text-gray-200 truncate">${esc(i.name)}</div>
        <div class="text-[11px] text-gray-500">${peso(i.price)} each</div>
        <div class="text-xs font-bold ${stock <= 0 ? 'text-red-400' : stock <= (i.lowStock || 5) ? 'text-amber-400' : 'text-green-400'}">${stock <= 0 ? 'OUT OF STOCK' : stock + ' left'}</div>
      </div>
      <button onclick="openQuick(${i.id})" class="text-xs px-3 py-2 ${stock <= 0 ? 'bg-gray-700 text-gray-500 cursor-not-allowed' : 'btn-glass text-white rounded-lg shadow'}">Sell</button>
    </div>`;
  }).join('');
}
function filterInventory(q) {
  q = (q || '').toLowerCase();
  const g = document.getElementById('inv-grid');
  if (g) g.innerHTML = invListHTML(data.inventory.filter(i => (i.name || '').toLowerCase().includes(q)));
}

// ---------- TRANSACTIONS ----------

  const v = document.getElementById('view');
  if (!data.transactions.length) { v.innerHTML = '<div class="text-center text-gray-400 py-16 fade-in"><div class="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>Loading...</div>'; await loadAll(); }
  const total = data.transactions.reduce((s, t) => s + (t.grandTotal || 0), 0);
  v.innerHTML = `
    <div class="flex items-center justify-between mb-3 fade-in">
      <h2 class="text-xl font-bold text-gray-100 flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Recent Sales</h2>
      <span class="text-sm font-bold text-gray-400 px-2 py-1 glass rounded-full">${peso(total)} total</span>
    </div>
    <div class="grid md:grid-cols-2 gap-2 sm:gap-3 fade-in">
      ${data.transactions.map(t => `
        <div class="glass-card rounded-xl p-3 flex items-center justify-between card-hover">
          <div class="min-w-0">
            <div class="font-semibold text-sm text-gray-200">${esc(t.clientName || 'Walk-in')}</div>
            <div class="text-[11px] text-gray-500">${esc(t.invoiceNo || '')} · ${fmtDate(t.date)} · ${esc(t.paymentMethod || 'Cash')}${t.items ? ' · ' + t.items + ' item' + (t.items === 1 ? '' : 's') : ''}</div>
          </div>
          <div class="text-right shrink-0">
            <div class="font-bold text-sm text-green-400">${peso(t.grandTotal)}</div>
            <div class="text-[10px] ${(t.status || '') === 'pending' ? 'text-amber-400' : 'text-gray-500'}">${esc(t.status == null ? '' : t.status === 'pending' ? 'Utang' : 'Paid')}</div>
          </div>
        </div>`).join('')}
    </div>`;
}

  const ls = document.getElementById('loading-screen');

  showView('home');
  connectWS();
  setInterval(() => { /* keep WS alive */ }, 25000);
})();
