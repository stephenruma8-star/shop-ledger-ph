<!DOCTYPE html>
<html lang="en-PH">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>Shop Ledger PH — Connect</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0f172a, #1e3a5f 55%, #1d4ed8); color: #f1f5f9; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .card { width: 100%; max-width: 24rem; background: rgba(30, 41, 59, .85); border: 1px solid rgba(255, 255, 255, .09); border-radius: 1.25rem; padding: 1.5rem; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); }
  .logo { width: 3.5rem; height: 3.5rem; margin: 0 auto .75rem; border-radius: 1rem; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #2563eb, #1d4ed8); font-size: 1.75rem; }
  h1 { font-size: 1.15rem; margin: 0 0 .25rem; text-align: center; }
  p.sub { font-size: .78rem; color: #94a3b8; text-align: center; margin: 0 0 1rem; }
  label { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #94a3b8; display: block; margin-bottom: .4rem; }
  input { display: block; width: 100%; height: 2.85rem; padding: 0 .85rem; border-radius: .75rem; background: rgba(15, 23, 42, .6); border: 1px solid rgba(255, 255, 255, .12); color: #f1f5f9; font-size: .95rem; outline: none; }
  input:focus { border-color: rgba(96, 165, 250, .6); }
  button { display: block; width: 100%; min-height: 3rem; margin-top: .6rem; border-radius: .8rem; border: 1px solid transparent; font-weight: 700; font-size: .95rem; cursor: pointer; }
  .btn-primary { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; }
  .btn-ghost { background: rgba(255, 255, 255, .07); color: #cbd5e1; border-color: rgba(255, 255, 255, .1); }
  .btn-danger { background: transparent; color: #f87171; border-color: rgba(239, 68, 68, .4); min-height: 2.4rem; font-size: .8rem; }
  #connect-error { display: none; font-size: .78rem; color: #f87171; margin-top: .6rem; text-align: center; }
  .srv { display: flex; gap: .5rem; align-items: center; margin-top: .6rem; padding: .6rem .7rem; border-radius: .8rem; background: rgba(15, 23, 42, .5); border: 1px solid rgba(255, 255, 255, .08); }
  .srv .meta { flex: 1; min-width: 0; }
  .srv .meta b { display: block; font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srv .meta span { font-size: .7rem; color: #94a3b8; }
  .srv button { width: auto; min-height: 2.4rem; margin-top: 0; padding: 0 .9rem; font-size: .8rem; }
  .foot { margin-top: 1rem; font-size: .68rem; color: #64748b; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🧾</div>
    <h1>Shop Ledger PH</h1>
    <p class="sub">Connect this phone to the shop computer</p>
    <label for="srv-url">Shop address</label>
    <input id="srv-url" type="text" inputmode="url" autocomplete="off" placeholder="http://192.168.1.5:3456" />
    <button class="btn-primary" onclick="connectManual()">Connect</button>
    <button class="btn-ghost" id="scan-btn" onclick="scanShopQR()">📷 Scan shop QR instead</button>
    <p id="connect-error"></p>
    <div id="srv-list"></div>
    <p class="foot" id="ver-foot">phone UI: bundled with this app</p>
  </div>
  <script src="connect.js"></script>
</body>
</html>
