name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/lint.mjs
      - run: npx tsc --noEmit -p tsconfig.json
      - run: node scripts/test-unit.mjs
      - run: npm run build
      - run: node scripts/smoke.mjs
      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run build:win
      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Shop-Ledger-PH-${{ github.ref_name }}
          path: |
            build/Shop-Ledger-PH-Setup-*.exe
            build/Shop-Ledger-PH-*-portable.exe
            build/latest.yml
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Shop-Ledger-PH-Setup-*.exe
            build/Shop-Ledger-PH-*-portable.exe
            build/latest.yml
          draft: true
