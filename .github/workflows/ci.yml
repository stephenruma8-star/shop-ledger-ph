name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint (syntax + JSON checks)
        run: npm run lint
      - name: Build renderer bundle
        run: npm run build
      - name: Smoke test (boot + all views)
        run: node scripts/smoke.mjs
      - name: Validation smoke (field validation wiring)
        run: node scripts/smoke-validation.mjs
      - name: Mobile Access QR harness
        run: node scripts/smoke-mobile.mjs
      - name: Mobile PWA page harness (7 views + LAN endpoints)
        run: node scripts/smoke-mobilepage.mjs
