name: Release Relay

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Direct download URL of the installer'
        required: true
      tag:
        description: 'Release tag to attach the installer to'
        required: true
        default: 'v3.4.40'

jobs:
  attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        run: curl -fL --retry 5 --connect-timeout 30 -o installer.exe "${{ github.event.inputs.url }}"
      - name: Show file
        run: ls -l installer.exe
      - name: Upload to release
        run: gh release upload "${{ github.event.inputs.tag }}" installer.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
