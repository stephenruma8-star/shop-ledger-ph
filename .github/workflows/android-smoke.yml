name: Android smoke (emulator)

# Boots the app on an Android emulator and runs the Maestro flow. This catches
# native/R8/plugin regressions that the headless JS suites cannot. Runs on
# demand (workflow_dispatch) because emulator runners are slow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.maestro/**'
      - '.github/workflows/android-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: mobile-app
        run: npm ci
      - name: Build debug APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Run Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            curl -Ls "https://get.maestro.mobile.dev" | bash
            export PATH="$PATH:$HOME/.maestro/bin"
            adb install -r mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test .maestro/smoke.yaml
